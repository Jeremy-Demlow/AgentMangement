project:
  name: agent-management-framework
  version: "0.6.0"
  description: "CI/CD reference framework for Snowflake Cortex Agents, Semantic Views, and dbt"

defaults:
  snowflake:
    account: trb65519

  schemas:
    raw: RAW
    staging: STAGING
    marts: MARTS
    semantic: SEMANTIC
    agents: AGENTS

  model:
    orchestration: claude-sonnet-4-5

  orchestration:
    budget:
      seconds: 300
      tokens: 50000

deployment:
  mode: single_account
  data_source: prod

environments:
  dev:
    database: AM_SKI_RESORT_DEV
    role: AM_DEPLOY_ROLE_DEV
    warehouse: AM_SKI_RESORT_WH_DEV
    semantic_schema: SEMANTIC
    agents_schema: AGENTS
    name_suffix: _DEV
  prod:
    database: AM_SKI_RESORT
    role: AM_DEPLOY_ROLE
    warehouse: AM_SKI_RESORT_WH
    semantic_schema: SEMANTIC
    agents_schema: AGENTS
    name_suffix: ""

agent_versioning:
  # Retain last N committed versions per (env, agent). Older versions are
  # dropped after deploy, skipping any version that still bears an alias.
  keep_last_n_versions: 10
  # Canonical alias vocabulary. Env config picks which aliases that env manages.
  aliases:
    dev: [latest]
    prod: [validated, production]

agents:
  resort_executive:
    semantic_views:
      - SEM_DAILY_SUMMARY
      - SEM_REVENUE
      - SEM_CUSTOMER_BEHAVIOR
      - SEM_OPERATIONS
      - SEM_STAFFING_ANALYTICS
      - SEM_WEATHER_ANALYTICS
      - SEM_MARKETING_ANALYTICS
      - SEM_CUSTOMER_SATISFACTION
      - SEM_SAFETY_INCIDENTS
      - SEM_LESSONS_ANALYTICS
      - SEM_PASSHOLDER_ANALYTICS
  ski_ops_assistant:
    semantic_views:
      - SEM_OPERATIONS
      - SEM_STAFFING_ANALYTICS
      - SEM_WEATHER_ANALYTICS
      - SEM_SAFETY_INCIDENTS

eval:
  source_schemas:
    marts: MARTS
    agents: AGENTS
  stage: eval_config_stage
  file_format: yaml_file_format
  sv_eval:
    stage: sv_eval_stage
    file_format: yaml_file_format
    default_scope: all

raw_tables:
  - PASS_USAGE
  - LIFT_SCANS
  - TICKET_SALES
  - FOOD_BEVERAGE
  - RENTALS
  - WEATHER_CONDITIONS
  - STAFFING_SCHEDULE
  - SKI_LESSONS
  - INCIDENTS
  - CUSTOMER_FEEDBACK
  - PARKING_OCCUPANCY
  - LIFT_MAINTENANCE
  - GROOMING_LOGS

semantic_views:
  source: dbt

dbt:
  project_dir: dbt_ski_resort
  profile: dbt_ski_resort
