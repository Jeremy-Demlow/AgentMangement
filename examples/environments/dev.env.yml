environment: dev

snowflake:
  account: YOUR_ACCOUNT
  role: MY_APP_DEPLOY_ROLE_DEV
  warehouse: MY_APP_WH_DEV

deployment:
  database: MY_APP_DEV
  semantic_schema: SEMANTIC
  agents_schema: AGENTS
  stage: EVAL_CONFIG_STAGE

semantic_views:
  source: dbt

agent:
  name_suffix: _DEV
  deploy_alias: latest
  aliases: [latest]

model:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 300
    tokens: 50000

eval:
  thresholds:
    answer_correctness: 0.60
    logical_consistency: 0.60
    sv_sql_correctness: 0.60
    sv_max_regressions: 5
