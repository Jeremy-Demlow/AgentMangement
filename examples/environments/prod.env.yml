environment: prod

snowflake:
  account: YOUR_ACCOUNT
  role: MY_APP_DEPLOY_ROLE
  warehouse: MY_APP_WH

deployment:
  database: MY_APP
  semantic_schema: SEMANTIC
  agents_schema: AGENTS
  stage: EVAL_CONFIG_STAGE

semantic_views:
  source: dbt

agent:
  name_suffix: ""
  deploy_alias: validated
  aliases: [validated, production]

model:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 300
    tokens: 50000

eval:
  thresholds:
    answer_correctness: 0.80
    logical_consistency: 0.80
    sv_sql_correctness: 0.40
    sv_max_regressions: 0
