[project]
name = "agent-management"
version = "0.7.0"
description = "CI/CD reference framework for Snowflake Cortex Agents, Semantic Views, and dbt"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "snowflake-connector-python>=3.6.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
crypto = [
    "cryptography>=41.0",
]

[project.scripts]
agent-mgmt-deploy-agents = "agent_management.agents.deploy:main"
agent-mgmt-deploy-svs = "agent_management.semantic_views.deploy:main"
agent-mgmt-validate = "agent_management.validate_specs:main"
agent-mgmt-validate-spec-format = "agent_management.validate_spec_format:main"
agent-mgmt-snapshot = "agent_management.agents.snapshot_state:main"
agent-mgmt-rollback = "agent_management.agents.rollback:main"
agent-mgmt-metrics = "agent_management.evals.metrics:main"
agent-mgmt-render-eval = "agent_management.evals.render_templates:main"
agent-mgmt-detect-drift = "agent_management.semantic_views.legacy_drift:main"
agent-mgmt-detect-sv-drift = "agent_management.semantic_views.drift:main"
agent-mgmt-deploy-svs-yaml = "agent_management.semantic_views.deploy_yaml:main"
agent-mgmt-regen-sv-gold = "agent_management.semantic_views.regen_gold:main"
agent-mgmt-snapshot-agent = "agent_management.agents.snapshot:main"
agent-mgmt-check-sv-eval = "agent_management.evals.sv_check:main"
agent-mgmt-eval-agent = "agent_management.evals.agent:main"
agent-mgmt-eval-sv = "agent_management.evals.semantic_view:main"
agent-mgmt-smoke-agent = "agent_management.agents.smoke:main"
agent-mgmt-agent-versioning = "agent_management.agents.versioning:main"
agent-mgmt-sync-vqrs = "agent_management.semantic_views.vqrs:main"
agent-mgmt-sv-scores = "agent_management.evals.sv_scores:main"
agent-mgmt-check-sv-evals = "agent_management.evals.sv_inventory:main"
agent-mgmt-format-sv-comment = "agent_management.evals.sv_comment:main"
agent-mgmt-format-rollback-comment = "agent_management.evals.rollback_comment:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_management*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
