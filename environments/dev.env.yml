# =============================================================================
# DEV Environment Configuration
# =============================================================================
# Used by: deploy-dev.yml, validate-pr.yml, and all agent_management CLI commands
#          when invoked with --env dev
#
# This file drives the entire DEV deployment pipeline:
#   - Snowflake connection (role, warehouse, database)
#   - Agent naming (suffix appended to agent names, e.g. RESORT_EXECUTIVE_DEV)
#   - LLM model selection for agent orchestration
#   - Agent budget limits (max seconds and tokens per interaction)
#   - Evaluation thresholds (pass/fail gates for CI evals)
#
# Template variables:
#   Values here are injected into agent specs, eval configs, and semantic view
#   definitions via Jinja2 templates ({{ env.* }} and {{ eval.* }} placeholders).
#   See agent_management/render_template.py build_context() for the full mapping.
#
# DEV thresholds are intentionally lenient (0.60) to allow iteration while
# establishing a baseline. Raise as agent quality improves.
# =============================================================================

environment: dev

# Snowflake connection settings for DEV
snowflake:
  account: trb65519
  role: AM_DEPLOY_ROLE_DEV
  warehouse: AM_SKI_RESORT_WH_DEV

# Where objects get deployed in Snowflake
deployment:
  database: AM_SKI_RESORT_DEV
  semantic_schema: SEMANTIC       # Semantic views (CREATE SEMANTIC VIEW)
  agents_schema: AGENTS           # Cortex Agents, eval datasets, stages
  stage: EVAL_CONFIG_STAGE        # Stage for eval config YAML uploads

semantic_views:
  source: dbt                     # "dbt" = views created by dbt run; "yaml" = deploy from YAML files

# Agent naming — suffix appended to all agent names in this environment
agent:
  name_suffix: _DEV               # RESORT_EXECUTIVE -> RESORT_EXECUTIVE_DEV

# LLM model used for agent orchestration
model:
  orchestration: claude-sonnet-4-5

# Agent interaction budget limits
orchestration:
  budget:
    seconds: 300                  # Max seconds per agent interaction
    tokens: 50000                 # Max tokens per agent interaction

# Evaluation pass/fail thresholds — injected into eval configs via
# {{ eval.thresholds.answer_correctness }} etc.
eval:
  thresholds:
    answer_correctness: 0.60      # Minimum avg score to pass (0.0-1.0)
    logical_consistency: 0.60     # Minimum avg score to pass (0.0-1.0)
    sv_sql_correctness: 0.60      # Semantic view SQL correctness gate
    sv_max_regressions: 5         # Max allowed VQR regressions (lenient for DEV)
