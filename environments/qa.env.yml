environment: qa

snowflake:
  account: trb65519
  role: AM_DEPLOY_ROLE_QA
  warehouse: AM_SKI_RESORT_WH_QA

deployment:
  database: AM_SKI_RESORT_QA
  semantic_schema: SEMANTIC
  agents_schema: AGENTS
  stage: EVAL_CONFIG_STAGE

agent:
  name_suffix: _QA

model:
  orchestration: claude-sonnet-4-5

orchestration:
  budget:
    seconds: 300
    tokens: 50000

eval:
  thresholds:
    answer_correctness: 0.70
    logical_consistency: 0.70
    sv_sql_correctness: 0.70
    sv_max_regressions: 2
