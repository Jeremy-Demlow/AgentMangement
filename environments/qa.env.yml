# =============================================================================
# QA Environment Configuration
# =============================================================================
# Used by: promote-qa.yml and all agent_management CLI commands
#          when invoked with --env qa
#
# This file drives the QA deployment pipeline:
#   - Snowflake connection (role, warehouse, database)
#   - Agent naming (suffix appended to agent names, e.g. RESORT_EXECUTIVE_QA)
#   - LLM model selection for agent orchestration
#   - Agent budget limits (max seconds and tokens per interaction)
#   - Evaluation thresholds (pass/fail gates — QA evals are hard failures)
#
# Template variables:
#   Values here are injected into agent specs, eval configs, and semantic view
#   definitions via Jinja2 templates ({{ env.* }} and {{ eval.* }} placeholders).
#   See agent_management/render_template.py build_context() for the full mapping.
#
# QA is the final validation gate before production. Eval failures here block
# the promotion — nothing gets to PROD without passing QA thresholds.
# =============================================================================

environment: qa

# Snowflake connection settings for QA
snowflake:
  account: trb65519
  role: AM_DEPLOY_ROLE_QA
  warehouse: AM_SKI_RESORT_WH_QA

# Where objects get deployed in Snowflake
deployment:
  database: AM_SKI_RESORT_QA
  semantic_schema: SEMANTIC       # Semantic views (CREATE SEMANTIC VIEW)
  agents_schema: AGENTS           # Cortex Agents, eval datasets, stages
  stage: EVAL_CONFIG_STAGE        # Stage for eval config YAML uploads

semantic_views:
  source: dbt                     # "dbt" = views created by dbt run; "yaml" = deploy from YAML files

# Agent naming — suffix appended to all agent names in this environment
agent:
  name_suffix: _QA                # RESORT_EXECUTIVE -> RESORT_EXECUTIVE_QA

# LLM model used for agent orchestration
model:
  orchestration: claude-sonnet-4-5

# Agent interaction budget limits
orchestration:
  budget:
    seconds: 300                  # Max seconds per agent interaction
    tokens: 50000                 # Max tokens per agent interaction

# Evaluation pass/fail thresholds — injected into eval configs via
# {{ eval.thresholds.answer_correctness }} etc.
# QA eval failures are HARD FAILURES — they block promotion to PROD.
eval:
  thresholds:
    answer_correctness: 0.70      # Minimum avg score to pass (0.0-1.0)
    logical_consistency: 0.70     # Minimum avg score to pass (0.0-1.0)
    sv_sql_correctness: 0.70      # Semantic view SQL correctness gate
    sv_max_regressions: 2         # Max allowed VQR regressions (stricter than DEV)
