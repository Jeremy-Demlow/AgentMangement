# =============================================================================
# PROD Environment Configuration
# =============================================================================
# Used by: promote-prod.yml and all agent_management CLI commands
#          when invoked with --env prod
#
# This file drives the PROD deployment pipeline:
#   - Snowflake connection (role, warehouse, database)
#   - Agent naming (no suffix — RESORT_EXECUTIVE is the production name)
#   - LLM model selection for agent orchestration
#   - Agent budget limits (max seconds and tokens per interaction)
#   - Evaluation thresholds (pass/fail gates — failures trigger auto-rollback)
#
# Template variables:
#   Values here are injected into agent specs, eval configs, and semantic view
#   definitions via Jinja2 templates ({{ env.* }} and {{ eval.* }} placeholders).
#   See agent_management/render_template.py build_context() for the full mapping.
#
# PROD has the strictest thresholds. Eval failures trigger automatic rollback
# from the pre-deploy snapshot. The 'production' GitHub Environment requires
# reviewer approval before deployment begins.
# =============================================================================

environment: prod

# Snowflake connection settings for PROD
snowflake:
  account: trb65519
  role: AM_DEPLOY_ROLE
  warehouse: AM_SKI_RESORT_WH

# Where objects get deployed in Snowflake
deployment:
  database: AM_SKI_RESORT
  semantic_schema: SEMANTIC       # Semantic views (CREATE SEMANTIC VIEW)
  agents_schema: AGENTS           # Cortex Agents, eval datasets, stages
  stage: EVAL_CONFIG_STAGE        # Stage for eval config YAML uploads

semantic_views:
  source: dbt                     # "dbt" = views created by dbt run; "yaml" = deploy from YAML files

# Agent naming + Cortex Agent Versioning
agent:
  name_suffix: ""                 # RESORT_EXECUTIVE (no suffix)
  # Alias moved automatically by deploy-prod-validated.yml on main merge.
  # The `production` alias is moved only by promote-validated-to-production.yml
  # after a human approval.
  deploy_alias: validated
  aliases: [validated, production]

# LLM model used for agent orchestration
model:
  orchestration: claude-sonnet-4-5

# Agent interaction budget limits
orchestration:
  budget:
    seconds: 300                  # Max seconds per agent interaction
    tokens: 50000                 # Max tokens per agent interaction

# Evaluation pass/fail thresholds — injected into eval configs via
# {{ eval.thresholds.answer_correctness }} etc.
# PROD eval failures trigger AUTOMATIC ROLLBACK from pre-deploy snapshot.
eval:
  thresholds:
    answer_correctness: 0.80      # Minimum avg score to pass (0.0-1.0)
    logical_consistency: 0.80     # Minimum avg score to pass (0.0-1.0)
    sv_sql_correctness: 0.40      # Semantic view SQL correctness gate (lowered to validate pipeline; raise after VQR stabilization)
    sv_max_regressions: 0         # Zero regressions allowed in production
