name: Snowflake Setup
description: Setup Python, install deps, write private key (requires checkout first)

inputs:
  python-version:
    description: Python version
    default: '3.11'
  requirements-file:
    description: Requirements file to install
    default: 'requirements.txt'
  snowflake-private-key:
    description: PEM-encoded private key
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r ${{ inputs.requirements-file }}
        # Install the agent-management package so the agent-mgmt-* console
        # scripts land on PATH. Without this, every workflow step that calls
        # an agent-mgmt-* command fails with "command not found".
        pip install .

    - name: Write private key
      shell: bash
      run: echo "${{ inputs.snowflake-private-key }}" > /tmp/snowflake_key.p8
