name: Deploy Dev

on:
  push:
    branches: [dev]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'semantic-views/verified_queries/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'dbt_ski_resort/**'
      - 'environments/**'

  workflow_dispatch: {}

# Cancel an in-flight DEV deploy if a newer commit lands on `dev`.
# Developers iterate fast; the newest change is the one we care about.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  snapshot:
    name: Pre-deploy Snapshot
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current state
        run: python -m agent_management.snapshot_state --env dev

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dev-pre-deploy-snapshot
          path: |
            agents/snapshots/dev/
            semantic-views/snapshots/dev/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy Semantic Views
    runs-on: ubuntu-latest
    needs: snapshot
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Sync VQRs into dbt models
        run: python -m agent_management.sync_vqrs_to_dbt

      - name: Bootstrap RAW seed tables (idempotent)
        # Loads LIFTS/LOCATIONS/PRODUCTS/TICKET_TYPES into <db>.RAW so dbt
        # marts/dimensions models can find source('raw', ...) on a fresh env.
        # Safe to re-run on every deploy: uses write_pandas(overwrite=True).
        env:
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: RAW
        run: python scripts/bootstrap_raw_seeds.py

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: dev
        run: |
          pip install 'dbt-snowflake==1.11.4'
          cd dbt_ski_resort
          dbt deps
          dbt run --target dev --select "+marts.facts" --profiles-dir .
          dbt run --target dev --select "marts.semantic" --profiles-dir .

      - name: Deploy/verify semantic views (dev)
        run: python -m agent_management.deploy_semantic_views --env dev

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval-gate:
    name: SV Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-svs
    environment: DEV
    # Strict by default. Threshold failures, crashes, and platform blockers
    # all hard-fail the gate. Operators re-trigger the workflow if a transient
    # platform blip caused the failure.
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run SV evaluations
        id: sv_eval
        # Exit code taxonomy from agent_management.run_sv_eval:
        #   0 = passed
        #   1 = threshold failure (HARD FAIL - real signal, fix the SV)
        #   2 = crash / unhandled (HARD FAIL - re-run if transient)
        #   3 = platform blocker (HARD FAIL - escalate to Snowflake)
        run: |
          set +e
          python -m agent_management.run_sv_eval --env dev --run-name "CI-${{ github.run_id }}-${{ github.sha }}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=passed"            >> "$GITHUB_OUTPUT"; exit 0 ;;
            1) echo "status=threshold_fail"    >> "$GITHUB_OUTPUT"; exit 1 ;;
            2) echo "status=crash"             >> "$GITHUB_OUTPUT"; exit 2 ;;
            3) echo "status=platform_blocked"  >> "$GITHUB_OUTPUT"; exit 3 ;;
            *) echo "status=unknown"           >> "$GITHUB_OUTPUT"; exit "$code" ;;
          esac

      - name: SV Eval Summary
        if: always()
        run: |
          case "${{ steps.sv_eval.outputs.status }}" in
            passed)
              echo "### SV Evaluation Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
              ;;
            threshold_fail)
              echo "### SV Evaluation Gate: FAILED (one or more SVs below threshold)" >> "$GITHUB_STEP_SUMMARY"
              echo "Real signal - the SV definition or its verified queries need attention." >> "$GITHUB_STEP_SUMMARY"
              echo "Re-running the workflow will not change the score; fix the SV." >> "$GITHUB_STEP_SUMMARY"
              ;;
            crash)
              echo "### SV Evaluation Gate: CRASHED (code=${{ steps.sv_eval.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
              echo "Likely transient platform issue. Re-run the workflow once before investigating." >> "$GITHUB_STEP_SUMMARY"
              ;;
            platform_blocked)
              echo "### SV Evaluation Gate: PLATFORM BLOCKED" >> "$GITHUB_STEP_SUMMARY"
              echo "Snowflake Cortex Analyst Evaluations regression. Open a support case before re-running." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "### SV Evaluation Gate: UNKNOWN (code=${{ steps.sv_eval.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy Agents
    runs-on: ubuntu-latest
    needs: sv-eval-gate
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy agents to dev (versioned)
        run: python -m agent_management.deploy_agents --env dev

      - name: Smoke test
        run: python -m agent_management.smoke_test --env dev --alias latest

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    needs: deploy-agents
    environment: DEV
    # Strict by default. Threshold failures and crashes block the dev deploy.
    # Operators re-trigger the workflow on transient platform issues.
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        id: agent_eval
        # Exit code taxonomy from agent_management.run_ci_eval:
        #   0 = all agents passed
        #   1 = threshold failure (HARD FAIL)
        #   2 = crash (HARD FAIL - re-run if transient)
        #   3 = platform blocker (HARD FAIL - escalate)
        run: |
          set +e
          python -m agent_management.run_ci_eval --env dev --alias latest
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "status=passed"            >> "$GITHUB_OUTPUT"; exit 0 ;;
            1) echo "status=threshold_fail"    >> "$GITHUB_OUTPUT"; exit 1 ;;
            2) echo "status=crash"             >> "$GITHUB_OUTPUT"; exit 2 ;;
            3) echo "status=platform_blocked"  >> "$GITHUB_OUTPUT"; exit 3 ;;
            *) echo "status=unknown"           >> "$GITHUB_OUTPUT"; exit "$code" ;;
          esac

      - name: Agent Eval Summary
        if: always()
        run: |
          case "${{ steps.agent_eval.outputs.status }}" in
            passed)
              echo "### Agent Evaluation Gate: PASSED" >> $GITHUB_STEP_SUMMARY
              ;;
            threshold_fail)
              echo "### Agent Evaluation Gate: FAILED (one or more agents below threshold)" >> $GITHUB_STEP_SUMMARY
              echo "Real signal - review agent spec, instructions, or eval dataset." >> $GITHUB_STEP_SUMMARY
              ;;
            crash)
              echo "### Agent Evaluation Gate: CRASHED (code=${{ steps.agent_eval.outputs.code }})" >> $GITHUB_STEP_SUMMARY
              echo "Likely transient platform issue. Re-run the workflow once before investigating." >> $GITHUB_STEP_SUMMARY
              ;;
            platform_blocked)
              echo "### Agent Evaluation Gate: PLATFORM BLOCKED" >> $GITHUB_STEP_SUMMARY
              echo "Snowflake Cortex Agent Evaluations regression. Open a support case." >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "### Agent Evaluation Gate: UNKNOWN (code=${{ steps.agent_eval.outputs.code }})" >> $GITHUB_STEP_SUMMARY
              ;;
          esac

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
