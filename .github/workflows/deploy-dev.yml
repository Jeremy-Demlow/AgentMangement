name: Deploy Dev

on:
  push:
    branches: [dev]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'semantic-views/verified_queries/**'
      - 'agent_management/**'
      - 'environments/**'

  workflow_dispatch:
    inputs:
      force_create:
        description: 'Force CREATE OR REPLACE for agents (destroys eval history)'
        required: false
        default: 'false'
        type: boolean

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  snapshot:
    name: Pre-deploy Snapshot
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current state
        run: python -m agent_management.snapshot_state --env dev

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dev-pre-deploy-snapshot
          path: |
            agents/snapshots/dev/
            semantic-views/snapshots/dev/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy Semantic Views
    runs-on: ubuntu-latest
    needs: snapshot
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Sync VQRs into dbt models
        run: python -m agent_management.sync_vqrs_to_dbt

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: dev
        run: |
          pip install dbt-snowflake
          cd dbt_ski_resort
          dbt deps
          dbt run --target dev --select "+marts.facts" --profiles-dir .
          dbt run --target dev --select "marts.semantic" --profiles-dir .

      - name: Deploy/verify semantic views (dev)
        run: python -m agent_management.deploy_semantic_views --env dev

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval-gate:
    name: SV Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-svs
    environment: DEV
    continue-on-error: true
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run SV evaluations
        run: python -m agent_management.run_sv_eval --env dev --run-name "CI-${{ github.sha }}"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy Agents
    runs-on: ubuntu-latest
    needs: sv-eval-gate
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy agents to dev
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_create }}" = "true" ]; then
            FORCE_FLAG="--force-create"
          fi
          python -m agent_management.deploy_agents --env dev $FORCE_FLAG

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    needs: deploy-agents
    environment: DEV
    continue-on-error: true
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        run: python -m agent_management.run_ci_eval --env dev

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
