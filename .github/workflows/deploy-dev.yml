name: Deploy Dev

on:
  push:
    branches: [dev]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'semantic-views/verified_queries/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'dbt_ski_resort/**'
      - 'environments/**'

  workflow_dispatch: {}

# Cancel an in-flight DEV deploy if a newer commit lands on `dev`.
# Developers iterate fast; the newest change is the one we care about.
concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  snapshot:
    name: Pre-deploy Snapshot
    runs-on: ubuntu-latest
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current state
        run: agent-mgmt-snapshot --env dev

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dev-pre-deploy-snapshot
          path: |
            agents/snapshots/dev/
            semantic-views/snapshots/dev/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy Semantic Views
    runs-on: ubuntu-latest
    needs: snapshot
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Sync VQRs into dbt models
        run: agent-mgmt-sync-vqrs

      - name: Bootstrap RAW seed tables (idempotent)
        # Loads LIFTS/LOCATIONS/PRODUCTS/TICKET_TYPES into <db>.RAW so dbt
        # marts/dimensions models can find source('raw', ...) on a fresh env.
        # Safe to re-run on every deploy: uses write_pandas(overwrite=True).
        env:
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: RAW
        run: python scripts/bootstrap_raw_seeds.py

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: dev
        run: |
          pip install 'dbt-snowflake==1.11.4'
          cd dbt_ski_resort
          dbt deps
          dbt run --target dev --select "+marts.facts" --profiles-dir .
          dbt run --target dev --select "marts.semantic" --profiles-dir .

      - name: Deploy/verify semantic views (dev)
        run: agent-mgmt-deploy-svs --env dev

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval-gate:
    name: SV Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-svs
    environment: DEV
    continue-on-error: true
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run SV evaluations
        id: sv_eval
        continue-on-error: true
        # Exit code taxonomy from agent_management.evals.sv_runner:
        #   0 = passed
        #   1 = threshold failure (advisory in DEV)
        #   2 = crash / unhandled (hard fail)
        #   3 = platform blocker (Cortex Analyst Evaluations PuPr bug) — advisory
        run: |
          set +e
          agent-mgmt-eval-sv --env dev --run-name "CI-${{ github.run_id }}-${{ github.sha }}"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$code" = "1" ]; then
            echo "status=threshold_fail" >> "$GITHUB_OUTPUT"
            exit 1
          elif [ "$code" = "3" ]; then
            echo "status=platform_blocked" >> "$GITHUB_OUTPUT"
            # Advisory — do not block the pipeline on a Snowflake platform bug.
            exit 0
          else
            echo "status=crash" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      - name: SV Eval Summary
        if: always()
        run: |
          case "${{ steps.sv_eval.outputs.status }}" in
            passed)
              echo "### SV Evaluation Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
              ;;
            threshold_fail)
              echo "### SV Evaluation Gate: FAILED (advisory in DEV)" >> "$GITHUB_STEP_SUMMARY"
              echo "One or more semantic views scored below threshold." >> "$GITHUB_STEP_SUMMARY"
              ;;
            platform_blocked)
              echo "### SV Evaluation Gate: PLATFORM BLOCKED" >> "$GITHUB_STEP_SUMMARY"
              echo "Snowflake Cortex Analyst Evaluations PuPr bug (SYSTEM_AI_OBS_ANALYST_EVAL_* object missing)." >> "$GITHUB_STEP_SUMMARY"
              echo "Pipeline continuing. This is a known Cortex Analyst evaluation platform blocker." >> "$GITHUB_STEP_SUMMARY"
              ;;
            crash|*)
              echo "### SV Evaluation Gate: CRASHED (code=${{ steps.sv_eval.outputs.code }})" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Fail gate on crash
        if: steps.sv_eval.outputs.status == 'crash'
        run: exit 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy Agents
    runs-on: ubuntu-latest
    needs: sv-eval-gate
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy agents to dev (versioned)
        run: agent-mgmt-deploy-agents --env dev

      - name: Smoke test
        run: agent-mgmt-smoke-agent --env dev --alias latest

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    needs: deploy-agents
    environment: DEV
    continue-on-error: true
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        id: agent_eval
        run: agent-mgmt-eval-agent --env dev --alias latest

      - name: Agent Eval Summary
        if: always()
        run: |
          if [ "${{ steps.agent_eval.outcome }}" = "success" ]; then
            echo "### ✅ Agent Evaluation Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Agent Evaluation Gate: FAILED (advisory in DEV)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dev-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
