name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'scripts/**'
      - 'environments/**'

  workflow_dispatch:
    inputs:
      force_create:
        description: 'Force CREATE OR REPLACE for agents (destroys eval history)'
        required: false
        default: 'false'
        type: boolean

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  snapshot:
    name: Pre-deploy Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Snapshot current state
        run: python -m agent_management.snapshot_state --env dev

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: dev-pre-deploy-snapshot
          path: |
            agents/snapshots/dev/
            semantic-views/snapshots/dev/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy Semantic Views
    runs-on: ubuntu-latest
    needs: snapshot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Run dbt build (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: dev
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          pip install dbt-snowflake
          cd dbt_ski_resort
          dbt deps
          dbt build --target dev --select "marts.facts" --profiles-dir .
          dbt build --target dev --select "marts.semantic" --profiles-dir .

      - name: Deploy semantic views to dev
        run: python -m agent_management.deploy_semantic_views --env dev

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval-gate:
    name: SV Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-svs
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Check SV eval results
        id: sv_eval
        run: |
          python -m agent_management.check_sv_eval --env dev --run-name "CI-${{ github.sha }}" || echo "sv_eval_available=false" >> $GITHUB_OUTPUT

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy Agents
    runs-on: ubuntu-latest
    needs: sv-eval-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Deploy agents to dev
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_create }}" = "true" ]; then
            FORCE_FLAG="--force-create"
          fi
          python -m agent_management.deploy_agents --env dev $FORCE_FLAG

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    needs: deploy-agents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography requests

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Run agent evaluations
        run: |
          for config in agent-evaluation/configs/*.yaml; do
            echo "=== Evaluating $(basename $config) ==="
            python agent-evaluation/run_eval.py "$config" --env dev || true
          done

      - name: Compute metrics and check thresholds
        run: python -m agent_management.compute_metrics --env dev --results-dir agent-evaluation/results/

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: dev-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
