name: Validate PR

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'environments/**'
      - 'tests/**'
      - 'dbt_ski_resort/**'

permissions:
  contents: read
  pull-requests: write

# New commits to a PR supersede older runs on the same PR.
concurrency:
  group: validate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run smoke tests
        run: pytest tests/test_smoke.py tests/test_templates.py -v

  validate-specs:
    name: Validate Specs (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all specs for dev
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env dev

      - name: Validate agent spec format (tool description template)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_spec_format agents/specs/resort_executive.yml agents/specs/ski_ops_assistant.yml

      - name: Validate all specs for prod
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env prod

  dbt-quality-gate:
    name: dbt Quality Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    environment: ${{ matrix.env == 'dev' && 'DEV' || 'PROD' }}
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Parse & compile dbt project for ${{ matrix.env }}
        working-directory: dbt_ski_resort
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir . --target ${{ matrix.env }}
          dbt compile --profiles-dir . --target ${{ matrix.env }}

      - name: Dry-run semantic views against ${{ matrix.env }}
        run: python -m agent_management.deploy_semantic_views --env ${{ matrix.env }} --dry-run

      - name: Dry-run agents against ${{ matrix.env }}
        run: python -m agent_management.deploy_agents --env ${{ matrix.env }} --dry-run

      - name: Detect SV drift vs dbt source of truth (advisory)
        id: drift_check
        continue-on-error: true
        run: python -m agent_management.detect_sv_drift --env ${{ matrix.env }} --fail-on-drift

      - name: Drift summary
        if: always()
        run: |
          if [ "${{ steps.drift_check.outcome }}" = "success" ]; then
            echo "### SV Drift Check (${{ matrix.env }}): CLEAN" >> $GITHUB_STEP_SUMMARY
          else
            echo "### SV Drift Check (${{ matrix.env }}): DRIFT DETECTED (advisory, not blocking)" >> $GITHUB_STEP_SUMMARY
            echo "One or more deployed SVs differ from the dbt model. See job logs for details." >> $GITHUB_STEP_SUMMARY
            echo "To clean up: run dbt run for the affected SV in the target environment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  rollback-history:
    name: Recent release activity
    # Only runs on PRs targeting main — reviewers see recent prod
    # rollbacks/promotes so they can weigh risk of the new change.
    # Read-only: queries the PROD audit table via the DEV job credentials
    # (which have SELECT on the audit table). Never writes.
    if: github.base_ref == 'main' && github.event.pull_request.number
    runs-on: ubuntu-latest
    needs: [lint-and-unit]
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Query rollback history (last 7 days)
        continue-on-error: true
        run: python -m agent_management.format_rollback_history_comment --env prod --days 7 --output /tmp/rollback_history.md

      - name: Comment PR with rollback history (if any)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/rollback_history.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8').trim();
            // Nothing to report: leave no comment (and clean up any old one)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Recent Release Activity')
            );
            if (!body) {
              // Delete stale comment if present
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
  validate-snowflake:
    name: Validate Against Snowflake
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate]
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Dry-run semantic views (dev)
        run: python -m agent_management.deploy_semantic_views --env dev --dry-run

      - name: Dry-run deploy agents (dev)
        run: python -m agent_management.deploy_agents --env dev --dry-run

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval:
    name: SV Evaluation (DEV)
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate, validate-snowflake]
    environment: DEV
    continue-on-error: ${{ github.base_ref == 'dev' }}
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run SV evaluations
        id: sv_eval
        continue-on-error: true
        env:
          SV_RUN_NAME: "PR-${{ github.event.pull_request.number }}-${{ github.run_id }}"
        run: python -m agent_management.run_sv_eval --env dev --run-name "$SV_RUN_NAME"

      - name: Collect SV eval scores (JSON)
        if: always()
        continue-on-error: true
        env:
          SV_RUN_NAME: "PR-${{ github.event.pull_request.number }}-${{ github.run_id }}"
        run: |
          mkdir -p agent-evaluation/results
          # Pass the same run-name so get_sv_eval_scores queries the exact rows
          # run_sv_eval just wrote, instead of relying on find_latest_run (which
          # depends on observability log indexing and often misses fresh runs).
          python -m agent_management.get_sv_eval_scores --env dev --run-name "$SV_RUN_NAME" --json > agent-evaluation/results/sv_eval_scores.json || echo '{"environment":"dev","threshold":0.80,"views":{},"all_passed":false}' > agent-evaluation/results/sv_eval_scores.json

      - name: Format SV eval PR comment
        if: always()
        continue-on-error: true
        run: python -m agent_management.format_sv_eval_comment --input agent-evaluation/results/sv_eval_scores.json --output /tmp/sv_eval_summary.md

      - name: Comment PR with SV eval summary
        if: always() && github.event.pull_request.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/sv_eval_summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            if (!body) return;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Semantic View Evaluation Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload SV eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sv-evaluation-results
          path: agent-evaluation/results/sv_eval_scores.json
          retention-days: 30

      - name: SV Eval Summary
        if: always()
        run: |
          if [ "${{ steps.sv_eval.outcome }}" = "success" ]; then
            echo "### ✅ SV Evaluation Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ SV Evaluation Gate: FAILED (advisory — does not block merge)" >> $GITHUB_STEP_SUMMARY
            echo "One or more semantic views scored below threshold or hit a platform flake (SEM_SAFETY_INCIDENTS 'Invocation failed' is a known Cortex Analyst issue)." >> $GITHUB_STEP_SUMMARY
            echo "The structural drift gate (detect_sv_drift --fail-on-drift in dbt Quality Gate) is the blocking check." >> $GITHUB_STEP_SUMMARY
          fi

      # SV Evaluation is advisory: Cortex Analyst evals are probabilistic and
      # occasionally hit platform-level "Invocation failed" errors on individual
      # views (SEM_SAFETY_INCIDENTS in particular). The blocking structural
      # gate is `detect_sv_drift --fail-on-drift` in the dbt-quality-gate job;
      # this job only reports scores. To re-enable a hard gate once the
      # platform flakiness is resolved, restore `exit 1` on non-success below.

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation (DEV)
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate, validate-snowflake, sv-eval]
    environment: DEV
    continue-on-error: ${{ github.base_ref == 'dev' }}
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        id: eval
        run: python -m agent_management.run_ci_eval --env dev

      - name: Agent Eval Summary
        if: always()
        run: |
          if [ "${{ steps.eval.outcome }}" = "success" ]; then
            echo "### ✅ Agent Evaluation Gate: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Agent Evaluation Gate: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Query eval summary
        if: always()
        id: summary
        run: python agent-evaluation/scripts/eval_summary.py --env dev --run-names agent-evaluation/results/run_names.json

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Comment PR with eval summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/eval_summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            if (!body) return;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('DEV Evaluation Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
