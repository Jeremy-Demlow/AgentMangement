name: Validate PR

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'environments/**'
      - 'tests/**'
      - 'dbt_ski_resort/**'

permissions:
  contents: read
  pull-requests: write

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run smoke tests
        run: pytest tests/test_smoke.py tests/test_templates.py -v

  validate-specs:
    name: Validate Specs (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all specs for dev
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env dev

      - name: Validate all specs for qa
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env qa

      - name: Validate all specs for prod
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env prod

  dbt-quality-gate:
    name: dbt Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Parse dbt project
        working-directory: dbt_ski_resort
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

  validate-snowflake:
    name: Validate Against Snowflake
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate]
    environment: DEV
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Dry-run semantic views (dev)
        run: python -m agent_management.deploy_semantic_views --env dev --dry-run

      - name: Dry-run deploy agents (dev)
        run: python -m agent_management.deploy_agents --env dev --dry-run

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent Evaluation (DEV)
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate, validate-snowflake]
    environment: DEV
    continue-on-error: ${{ github.base_ref == 'dev' }}
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        id: eval
        run: python -m agent_management.run_ci_eval --env dev

      - name: Query eval summary
        if: always()
        id: summary
        run: python agent-evaluation/scripts/eval_summary.py --env dev

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-evaluation-results
          path: agent-evaluation/results/
          retention-days: 30

      - name: Comment PR with eval summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/eval_summary.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            if (!body) return;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('DEV Evaluation Summary')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
