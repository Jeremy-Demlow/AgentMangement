name: Validate PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'environments/**'
      - 'tests/**'
      - 'dbt_ski_resort/**'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  lint-and-unit:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run smoke tests
        run: pytest tests/test_smoke.py tests/test_templates.py -v

  validate-specs:
    name: Validate Specs (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate all specs for dev
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env dev

      - name: Validate all specs for qa
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env qa

      - name: Validate all specs for prod
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.validate_specs --env prod

  dbt-quality-gate:
    name: dbt Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Parse dbt project
        working-directory: dbt_ski_resort
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

  validate-snowflake:
    name: Validate Against Snowflake
    runs-on: ubuntu-latest
    needs: [lint-and-unit, validate-specs, dbt-quality-gate]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Deploy semantic views (dev)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.deploy_semantic_views --env dev

      - name: Deploy agents (dev)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.deploy_agents --env dev

      - name: Schema drift check (dev)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.detect_drift --env dev

      - name: Run agent evaluation (dev)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m agent_management.run_ci_eval --env dev

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
