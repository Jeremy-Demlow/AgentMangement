name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      timestamp:
        description: 'Snapshot timestamp (YYYYMMDD_HHMMSS) — leave empty to see available'
        required: false
        default: ''
      target:
        description: 'What to rollback'
        required: true
        type: choice
        options:
          - all
          - agents
          - semantic-views
      dry_run:
        description: 'Dry run (show what would be restored without executing)'
        required: false
        default: 'true'
        type: boolean

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  PYTHONPATH: ${{ github.workspace }}

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml jinja2 snowflake-connector-python cryptography

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: List available snapshots
        if: inputs.timestamp == ''
        run: |
          echo "Available snapshots for ${{ inputs.environment }}:"
          python -m agent_management.rollback --env ${{ inputs.environment }} --list
          echo ""
          echo "Re-run this workflow with a timestamp from the list above."
          exit 1

      - name: Execute rollback
        if: inputs.timestamp != ''
        run: |
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python -m agent_management.rollback \
            --env ${{ inputs.environment }} \
            --timestamp ${{ inputs.timestamp }} \
            --target ${{ inputs.target }} \
            $DRY_FLAG

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
