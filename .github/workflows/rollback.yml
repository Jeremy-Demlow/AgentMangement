name: Rollback

# Alias-reassignment rollback. Single DDL:
#   ALTER AGENT <fqn> MODIFY VERSION <target> SET ALIAS = <alias>
#
# Reads the most recent snapshot pointer under
#   .snowflake/ci/snapshots/<env>/<agent>/
# to determine the target version (or you can pass it explicitly via --to).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, prod]
      agent:
        description: 'Agent short name or FQN (e.g. resort_executive)'
        required: true
      alias:
        description: 'Alias to reassign'
        required: true
        type: choice
        options: [latest, validated, production]
      target_version:
        description: 'Explicit VERSION$N to roll to (leave empty to use the last snapshot pointer)'
        required: false
        default: ''

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }} (${{ inputs.alias }})
    runs-on: ubuntu-latest
    environment: >-
      ${{ inputs.environment == 'prod' && 'production-promote' || 'DEV' }}
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Rollback (alias reassignment)
        run: |
          CMD="agent-mgmt-rollback --env ${{ inputs.environment }} --agent ${{ inputs.agent }} --alias ${{ inputs.alias }}"
          if [ -n "${{ inputs.target_version }}" ]; then
            CMD="$CMD --to ${{ inputs.target_version }}"
          fi
          echo "$CMD"
          $CMD

      - name: Smoke test
        run: agent-mgmt-smoke-agent --env ${{ inputs.environment }} --agent ${{ inputs.agent }} --alias ${{ inputs.alias }}

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
