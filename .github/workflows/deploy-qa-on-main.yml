name: Deploy to QA (Main Push)

on:
  push:
    branches: [main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'environments/**'
      - 'dbt_ski_resort/**'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  snapshot:
    name: Snapshot QA State
    runs-on: ubuntu-latest
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current QA state
        run: python -m agent_management.snapshot_state --env qa

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: qa-auto-deploy-snapshot
          path: |
            agents/snapshots/qa/
            semantic-views/snapshots/qa/
          retention-days: 90

      - name: Schema drift check
        run: python -m agent_management.detect_drift --env qa

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy Semantic Views (QA)
    runs-on: ubuntu-latest
    needs: snapshot
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Sync VQRs into dbt models
        run: python -m agent_management.sync_vqrs_to_dbt

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: qa
        run: |
          pip install dbt-snowflake
          cd dbt_ski_resort
          dbt deps
          dbt run --target qa --select "+marts.facts" --profiles-dir .
          dbt run --target qa --select "marts.semantic" --profiles-dir .

      - name: Deploy/verify semantic views (QA)
        run: python -m agent_management.deploy_semantic_views --env qa

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  sv-eval-gate:
    name: SV Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-svs
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run SV evaluations
        run: python -m agent_management.run_sv_eval --env qa --run-name "CI-${{ github.sha }}"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy Agents (QA)
    runs-on: ubuntu-latest
    needs: sv-eval-gate
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy agents to QA
        run: python -m agent_management.deploy_agents --env qa

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  qa-eval:
    name: QA Agent Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy-agents
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations (QA)
        run: python -m agent_management.run_ci_eval --env qa

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-auto-evaluation-results
          path: agent-evaluation/results/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
