name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      force_create:
        description: 'Force CREATE OR REPLACE for agents (destroys eval history)'
        required: false
        default: 'false'
        type: boolean
      skip_eval:
        description: 'Skip evaluation gate (emergency only)'
        required: false
        default: 'false'
        type: boolean

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    environment: production
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Validate specs for prod
        run: python -m agent_management.validate_specs --env prod --remote

      - name: Schema drift check
        run: python -m agent_management.detect_drift --env prod

      - name: Dry-run deployments
        run: |
          python -m agent_management.deploy_semantic_views --env prod --dry-run
          python -m agent_management.deploy_agents --env prod --dry-run

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  snapshot:
    name: Snapshot Prod State
    runs-on: ubuntu-latest
    needs: pre-flight
    environment: PROD
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    outputs:
      snapshot_timestamp: ${{ steps.snap.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Snapshot current prod state
        id: snap
        run: |
          python -m agent_management.snapshot_state --env prod
          TIMESTAMP=$(ls -t agents/snapshots/prod/*.json 2>/dev/null | head -1 | grep -oE '[0-9]{8}_[0-9]{6}')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Snapshot timestamp: $TIMESTAMP"

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: prod-pre-deploy-snapshot
          path: |
            agents/snapshots/prod/
            semantic-views/snapshots/prod/
          retention-days: 365

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: snapshot
    environment: PROD
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: prod
        run: |
          pip install dbt-snowflake
          cd dbt_ski_resort
          dbt deps
          dbt run --target prod --select "+marts.facts" --profiles-dir .
          dbt run --target prod --select "marts.semantic" --profiles-dir .

      - name: Deploy semantic views to prod
        run: python -m agent_management.deploy_semantic_views --env prod

      - name: Deploy agents to prod
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_create }}" = "true" ]; then
            FORCE_FLAG="--force-create"
          fi
          python -m agent_management.deploy_agents --env prod $FORCE_FLAG

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  eval-gate:
    name: Evaluation Gate
    runs-on: ubuntu-latest
    needs: [deploy, snapshot]
    if: inputs.skip_eval != 'true'
    environment: PROD
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Run agent evaluations
        id: eval
        run: |
          FAILED=0
          for config in agent-evaluation/configs/*.yaml; do
            echo "=== Evaluating $(basename $config) ==="
            python agent-evaluation/scripts/run_eval.py "$config" --env prod || true
          done

      - name: Check thresholds (strict)
        id: threshold
        run: python -m agent_management.compute_metrics --env prod --results-dir agent-evaluation/results/ --strict

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-evaluation-results
          path: agent-evaluation/results/
          retention-days: 365

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  auto-rollback:
    name: Auto-Rollback on Eval Failure
    runs-on: ubuntu-latest
    needs: [eval-gate, snapshot]
    if: failure() && needs.eval-gate.result == 'failure'
    environment: PROD
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write private key
        run: echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8

      - name: Download pre-deploy snapshots
        uses: actions/download-artifact@v4
        with:
          name: prod-pre-deploy-snapshot
          path: .

      - name: Rollback to pre-deploy snapshot
        run: |
          TIMESTAMP="${{ needs.snapshot.outputs.snapshot_timestamp }}"
          echo "Rolling back prod to snapshot $TIMESTAMP"
          python -m agent_management.rollback --env prod --timestamp "$TIMESTAMP" --target all

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
