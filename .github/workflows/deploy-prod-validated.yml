name: Deploy Prod (validated)

# On every main-merge we:
#   1. snapshot current state
#   2. deploy dbt/SVs/agents to PROD
#   3. move the `validated` alias to the new version
#   4. smoke + eval the `validated` alias
#
# SINGLE APPROVAL GATE: only the `prod-gate` job carries `environment: PROD`.
# Subsequent jobs `needs:` prod-gate and run automatically once the single
# PROD approval is granted. The `production` alias (customer traffic) is
# still behind a *separate* `production-promote` environment in the
# promote-validated-to-production.yml workflow.

on:
  push:
    branches: [main]
    paths:
      - 'agents/specs/**'
      - 'semantic-views/definitions/**'
      - 'semantic-views/verified_queries/**'
      - 'agent_management/**'
      - 'agent-evaluation/**'
      - 'environments/**'
      - 'dbt_ski_resort/**'

  workflow_dispatch: {}

# Cancel an in-flight deploy if a newer commit lands on main (protect warehouse credits).
concurrency:
  group: deploy-prod-validated
  cancel-in-progress: false  # never cancel a prod deploy mid-run; queue instead

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  # SINGLE APPROVAL GATE. The reviewer approves PROD once, and all 4
  # subsequent jobs run automatically.
  prod-gate:
    name: PROD approval gate
    runs-on: ubuntu-latest
    environment: PROD
    # Export the env-scoped vars so downstream jobs (which do NOT attach
    # environment: PROD — that would re-trigger approval) can read them.
    outputs:
      warehouse: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      role: ${{ vars.SNOWFLAKE_ROLE }}
      database: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - name: Approval acknowledged
        run: |
          echo "### PROD deploy approved" >> $GITHUB_STEP_SUMMARY
          echo "Approved by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Subsequent jobs (snapshot -> SVs -> deploy -> eval) will run automatically." >> $GITHUB_STEP_SUMMARY

  snapshot:
    name: Pre-deploy snapshot (prod)
    runs-on: ubuntu-latest
    needs: prod-gate
    env:
      SNOWFLAKE_WAREHOUSE: ${{ needs.prod-gate.outputs.warehouse }}
      SNOWFLAKE_ROLE: ${{ needs.prod-gate.outputs.role }}
      SNOWFLAKE_DATABASE: ${{ needs.prod-gate.outputs.database }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current state (pointer)
        run: python -m agent_management.snapshot_state --env prod

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: prod-pre-deploy-snapshot
          path: .snowflake/ci/snapshots/prod/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-svs:
    name: Deploy semantic views (prod)
    runs-on: ubuntu-latest
    needs: [prod-gate, snapshot]
    env:
      SNOWFLAKE_WAREHOUSE: ${{ needs.prod-gate.outputs.warehouse }}
      SNOWFLAKE_ROLE: ${{ needs.prod-gate.outputs.role }}
      SNOWFLAKE_DATABASE: ${{ needs.prod-gate.outputs.database }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Sync VQRs into dbt models
        run: python -m agent_management.sync_vqrs_to_dbt

      - name: Run dbt
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: prod
        run: |
          pip install 'dbt-snowflake==1.11.4'
          cd dbt_ski_resort
          dbt deps
          dbt run --target prod --select "+marts.facts" --profiles-dir .
          dbt run --target prod --select "marts.semantic" --profiles-dir .

      - name: Deploy/verify semantic views (prod)
        run: python -m agent_management.deploy_semantic_views --env prod

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy-agents:
    name: Deploy agents (alias=validated)
    runs-on: ubuntu-latest
    needs: [prod-gate, deploy-svs]
    env:
      SNOWFLAKE_WAREHOUSE: ${{ needs.prod-gate.outputs.warehouse }}
      SNOWFLAKE_ROLE: ${{ needs.prod-gate.outputs.role }}
      SNOWFLAKE_DATABASE: ${{ needs.prod-gate.outputs.database }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Deploy agents (versioned, alias=validated)
        run: python -m agent_management.deploy_agents --env prod

      - name: Smoke test (validated)
        run: python -m agent_management.smoke_test --env prod --alias validated

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  agent-eval:
    name: Agent evaluation (validated)
    runs-on: ubuntu-latest
    needs: [prod-gate, deploy-agents]
    env:
      SNOWFLAKE_WAREHOUSE: ${{ needs.prod-gate.outputs.warehouse }}
      SNOWFLAKE_ROLE: ${{ needs.prod-gate.outputs.role }}
      SNOWFLAKE_DATABASE: ${{ needs.prod-gate.outputs.database }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      # Eval exit codes from run_ci_eval:
      #   0 = all passed
      #   1 = ran but below threshold (advisory — alias has already moved)
      #   2 = crashed (infrastructure bug OR Cortex eval service hang)
      #
      # Retry ONCE on crash (exit 2): transient platform issues like the
      # eval service hanging in CREATED status typically clear on a second
      # attempt. Don't retry on threshold-fail — that's real signal.
      - name: Run agent evaluations on validated alias
        id: eval
        run: |
          set +e
          code=2
          for attempt in 1 2; do
            echo "=== Eval attempt $attempt/2 ==="
            python -m agent_management.run_ci_eval --env prod --alias validated
            code=$?
            # Only retry on crash. Pass and threshold-fail are terminal.
            if [ "$code" != "2" ]; then
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "Eval crashed (likely Cortex hang); retrying in 60s..."
              sleep 60
            fi
          done
          echo "eval_exit=$code" >> $GITHUB_OUTPUT
          if [ "$code" = "0" ] || [ "$code" = "1" ]; then
            exit 0
          else
            exit $code
          fi

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-validated-eval-results
          path: agent-evaluation/results/
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          code="${{ steps.eval.outputs.eval_exit }}"
          case "$code" in
            0)  echo "### Prod validated deploy: PASSED (deploy + eval)" >> $GITHUB_STEP_SUMMARY ;;
            1)  echo "### Prod validated deploy: DEPLOY OK, EVAL ADVISORY FAIL" >> $GITHUB_STEP_SUMMARY
                echo "Alias 'validated' moved successfully. Eval ran but scored below threshold." >> $GITHUB_STEP_SUMMARY
                echo "Investigate scores in the uploaded artifact." >> $GITHUB_STEP_SUMMARY ;;
            *)  echo "### Prod validated deploy: EVAL CRASHED" >> $GITHUB_STEP_SUMMARY
                echo "Infrastructure error — eval script could not complete." >> $GITHUB_STEP_SUMMARY
                echo "Check step logs: likely a permission/role or SQL error, NOT a content issue." >> $GITHUB_STEP_SUMMARY ;;
          esac
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To promote to customer traffic, run 'Promote validated -> production'." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
