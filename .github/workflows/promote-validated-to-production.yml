name: Promote validated -> production

# Reassigns the `production` alias on each configured agent to the version
# currently held by `validated`. This is the human-approval gate: customer
# traffic moves only after a reviewer approves the `production-promote`
# environment.
#
# Runs a post-flip smoke test + eval as a safety check. If these fail the
# operator should trigger rollback.yml immediately.

on:
  workflow_dispatch:
    inputs:
      agent:
        description: 'Single agent short name or FQN. Omit to promote all configured agents.'
        required: false

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  promote:
    name: Promote alias
    runs-on: ubuntu-latest
    environment: production-promote
    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Promote validated -> production
        run: |
          if [ -n "${{ inputs.agent }}" ]; then
            agent-mgmt-agent-versioning promote --env prod --from validated --to production --agent ${{ inputs.agent }}
          else
            agent-mgmt-agent-versioning promote --env prod --from validated --to production
          fi

      - name: Smoke test (production)
        run: agent-mgmt-smoke-agent --env prod --alias production

      - name: Post-promote eval (production)
        id: eval
        # Advisory for threshold-fail only; crashes still fail the job.
        # Retry ONCE on crash (exit 2) — transient Cortex eval hangs.
        run: |
          set +e
          code=2
          for attempt in 1 2; do
            echo "=== Eval attempt $attempt/2 ==="
            agent-mgmt-eval-agent --env prod --alias production
            code=$?
            if [ "$code" != "2" ]; then break; fi
            if [ "$attempt" = "1" ]; then
              echo "Eval crashed (likely Cortex hang); retrying in 60s..."
              sleep 60
            fi
          done
          echo "eval_exit=$code" >> $GITHUB_OUTPUT
          if [ "$code" = "0" ] || [ "$code" = "1" ]; then exit 0; else exit $code; fi

      - name: Summary
        if: always()
        run: |
          code="${{ steps.eval.outputs.eval_exit }}"
          case "$code" in
            0)  echo "### Production promotion: PASSED (promote + eval)" >> $GITHUB_STEP_SUMMARY ;;
            1)  echo "### Production promotion: PROMOTE OK, EVAL ADVISORY FAIL" >> $GITHUB_STEP_SUMMARY
                echo "Alias 'production' reassigned. Post-promote eval scored below threshold." >> $GITHUB_STEP_SUMMARY
                echo "Investigate scores; if concerning, trigger rollback.yml." >> $GITHUB_STEP_SUMMARY ;;
            *)  echo "### Production promotion: EVAL CRASHED" >> $GITHUB_STEP_SUMMARY
                echo "Infrastructure error — eval script could not complete." >> $GITHUB_STEP_SUMMARY ;;
          esac

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
