name: Promote to QA

on:
  workflow_dispatch:
    inputs:
      force_create:
        description: 'Force CREATE OR REPLACE for agents (destroys eval history)'
        required: false
        default: 'false'
        type: boolean
      skip_eval:
        description: 'Skip evaluation gate (emergency only)'
        required: false
        default: 'false'
        type: boolean

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
  PYTHONPATH: ${{ github.workspace }}

jobs:
  pre-flight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Validate specs for QA
        run: python -m agent_management.validate_specs --env qa --remote

      - name: Schema drift check
        run: python -m agent_management.detect_drift --env qa

      - name: Dry-run deployments
        run: |
          python -m agent_management.deploy_semantic_views --env qa --dry-run
          python -m agent_management.deploy_agents --env qa --dry-run

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  snapshot:
    name: Snapshot QA State
    runs-on: ubuntu-latest
    needs: pre-flight
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Snapshot current QA state
        run: python -m agent_management.snapshot_state --env qa

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: qa-pre-deploy-snapshot
          path: |
            agents/snapshots/qa/
            semantic-views/snapshots/qa/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  deploy:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: snapshot
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run dbt (if dbt project exists)
        if: hashFiles('dbt_ski_resort/dbt_project.yml') != ''
        env:
          DBT_TARGET: qa
        run: |
          pip install dbt-snowflake
          cd dbt_ski_resort
          dbt deps
          dbt run --target qa --select "+marts.facts" --profiles-dir .
          dbt run --target qa --select "marts.semantic" --profiles-dir .

      - name: Deploy semantic views to QA
        run: python -m agent_management.deploy_semantic_views --env qa

      - name: Deploy agents to QA
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_create }}" = "true" ]; then
            FORCE_FLAG="--force-create"
          fi
          python -m agent_management.deploy_agents --env qa $FORCE_FLAG

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8

  eval-gate:
    name: Evaluation Gate
    runs-on: ubuntu-latest
    needs: deploy
    if: inputs.skip_eval != 'true'
    environment: QA
    env:
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Snowflake
        uses: ./.github/actions/snowflake-setup
        with:
          snowflake-private-key: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

      - name: Run agent evaluations
        run: python -m agent_management.run_ci_eval --env qa

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evaluation-results
          path: agent-evaluation/results/
          retention-days: 90

      - name: Cleanup
        if: always()
        run: rm -f /tmp/snowflake_key.p8
