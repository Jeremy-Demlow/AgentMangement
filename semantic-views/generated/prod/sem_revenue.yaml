verified_queries:
  - name: revenue_by_month
    question: What is the total revenue by month broken down by ticket sales, rentals, and food and beverage?
    sql: >-
      SELECT d.CALENDAR_YEAR, d.MONTH_NAME, SUM(ts.PURCHASE_AMOUNT) AS ticket_revenue,
      SUM(r.RENTAL_AMOUNT) AS rental_revenue, SUM(fb.TOTAL_AMOUNT) AS food_beverage_revenue
      FROM fact_ticket_sales AS ts JOIN dim_date AS d ON ts.PURCHASE_DATE_KEY = d.DATE_KEY
      LEFT JOIN fact_rentals AS r ON r.RENTAL_DATE_KEY = d.DATE_KEY LEFT JOIN fact_food_beverage
      AS fb ON fb.TRANSACTION_DATE_KEY = d.DATE_KEY GROUP BY d.CALENDAR_YEAR, d.MONTH_NAME
      ORDER BY d.CALENDAR_YEAR, d.MONTH_NAME
    verified_at: 1774649498
    verified_by: Semantic Model Generator
  - name: ticket_revenue_by_segment
    question: What is the ticket revenue by customer segment and age group?
    sql: >-
      SELECT c.CUSTOMER_SEGMENT, c.AGE_GROUP, COUNT(DISTINCT ts.CUSTOMER_KEY) AS
      unique_customers, SUM(ts.PURCHASE_AMOUNT) AS total_ticket_spend FROM fact_ticket_sales
      AS ts JOIN dim_customer AS c ON ts.CUSTOMER_KEY = c.CUSTOMER_KEY GROUP BY c.CUSTOMER_SEGMENT,
      c.AGE_GROUP ORDER BY total_ticket_spend DESC
    verified_at: 1774649498
    verified_by: Semantic Model Generator
  - name: food_bev_by_location
    question: What is the food and beverage revenue performance by location, including total items sold and average pricing?
    sql: >-
      SELECT l.LOCATION_NAME, l.LOCATION_TYPE, SUM(fb.TOTAL_AMOUNT) AS food_bev_revenue,
      SUM(fb.QUANTITY) AS total_items_sold, AVG(fb.UNIT_PRICE) AS avg_unit_price FROM
      fact_food_beverage AS fb JOIN dim_location AS l ON fb.LOCATION_KEY = l.LOCATION_KEY
      GROUP BY l.LOCATION_NAME, l.LOCATION_TYPE ORDER BY food_bev_revenue DESC
    verified_at: 1774649498
    verified_by: Semantic Model Generator
  - name: top_ticket_types
    question: What are the top selling ticket types by revenue?
    sql: >-
      SELECT tt.TICKET_NAME, tt.TICKET_CATEGORY, tt.ACCESS_LEVEL, COUNT(*) AS tickets_sold,
      SUM(ts.PURCHASE_AMOUNT) AS total_revenue, AVG(ts.DISCOUNT_AMOUNT) AS avg_discount
      FROM fact_ticket_sales AS ts JOIN dim_ticket_type AS tt ON ts.TICKET_TYPE_KEY
      = tt.TICKET_TYPE_KEY GROUP BY tt.TICKET_NAME, tt.TICKET_CATEGORY, tt.ACCESS_LEVEL
      ORDER BY total_revenue DESC
    verified_at: 1774649498
    verified_by: Semantic Model Generator
  - name: rental_by_product
    question: What is the rental performance by equipment category and type, including revenue, volume, and average rental duration?
    sql: >-
      SELECT p.PRODUCT_CATEGORY, p.PRODUCT_TYPE, COUNT(*) AS rental_count, SUM(r.RENTAL_AMOUNT)
      AS rental_revenue, AVG(r.RENTAL_DURATION_HOURS) AS avg_duration_hours FROM fact_rentals
      AS r JOIN dim_product AS p ON r.PRODUCT_KEY = p.PRODUCT_KEY GROUP BY p.PRODUCT_CATEGORY,
      p.PRODUCT_TYPE ORDER BY rental_revenue DESC
    verified_at: 1774649498
    verified_by: Semantic Model Generator
