verified_queries:
  - name: busiest_lifts
    question: What are the busiest lifts by total scans and average wait time?
    sql: >-
      SELECT l.LIFT_NAME, l.LIFT_TYPE, COUNT(*) AS total_scans, AVG(ls.WAIT_TIME_MINUTES)
      AS avg_wait_time FROM fact_lift_scans AS ls JOIN dim_lift AS l ON ls.LIFT_KEY
      = l.LIFT_KEY GROUP BY l.LIFT_NAME, l.LIFT_TYPE ORDER BY total_scans DESC
    verified_at: 1774649726
    verified_by: Semantic Model Generator
  - name: daily_scan_trend
    question: What is the daily lift scan volume and average wait time trend?
    sql: >-
      SELECT d.FULL_DATE, d.DAY_NAME, COUNT(*) AS daily_scans, AVG(ls.WAIT_TIME_MINUTES)
      AS avg_wait FROM fact_lift_scans AS ls JOIN dim_date AS d ON ls.DATE_KEY = d.DATE_KEY
      GROUP BY d.FULL_DATE, d.DAY_NAME ORDER BY d.FULL_DATE
    verified_at: 1774649726
    verified_by: Semantic Model Generator
