name: sem_operations
description: Lift operations analytics for ski resort. Tracks lift scan volumes, wait
  times, weather conditions at scan time, and lift utilization by lift type, terrain,
  and time period.
tables:
  - name: FACT_LIFT_SCANS
    base_table:
      database: AM_SKI_RESORT
      schema: MARTS
      table: FACT_LIFT_SCANS
    dimensions:
      - name: SCAN_KEY
        expr: SCAN_KEY
        data_type: VARCHAR
      - name: DATE_KEY
        expr: DATE_KEY
        data_type: NUMBER
      - name: CUSTOMER_KEY
        expr: CUSTOMER_KEY
        data_type: VARCHAR
      - name: LIFT_KEY
        expr: LIFT_KEY
        data_type: VARCHAR
      - name: SCAN_ID
        expr: SCAN_ID
        data_type: VARCHAR
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        data_type: VARCHAR
      - name: LIFT_ID
        expr: LIFT_ID
        data_type: VARCHAR
      - name: TEMPERATURE_F
        expr: TEMPERATURE_F
        data_type: NUMBER
      - name: WEATHER_CONDITION
        expr: WEATHER_CONDITION
        data_type: VARCHAR
      - name: SCAN_HOUR
        expr: SCAN_HOUR
        data_type: NUMBER
      - name: DAY_OF_WEEK
        expr: DAY_OF_WEEK
        data_type: NUMBER
    time_dimensions:
      - name: SCAN_TIMESTAMP
        expr: SCAN_TIMESTAMP
        data_type: TIMESTAMP_NTZ
    facts:
      - name: WAIT_TIME_MINUTES
        expr: WAIT_TIME_MINUTES
        data_type: NUMBER
    metrics:
      - name: TOTAL_LIFT_SCANS
        description: "Total number of lift scans recorded"
        expr: COUNT(SCAN_KEY)
        access_modifier: public_access
      - name: AVG_WAIT_TIME
        description: "Average wait time in minutes at lifts"
        expr: AVG(WAIT_TIME_MINUTES)
        access_modifier: public_access
      - name: MAX_WAIT_TIME
        description: "Maximum wait time in minutes recorded"
        expr: MAX(WAIT_TIME_MINUTES)
        access_modifier: public_access
      - name: UNIQUE_RIDERS
        description: "Count of distinct customers who rode lifts"
        expr: COUNT(DISTINCT CUSTOMER_KEY)
        access_modifier: public_access
