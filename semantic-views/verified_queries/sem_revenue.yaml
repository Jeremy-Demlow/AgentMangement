  - name: total_ticket_revenue_last_season
    question: "What was our total ticket revenue last season?"
    sql: >-
      WITH last_season AS (
        SELECT MAX(ski_season) AS season
        FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_REVENUE
          DIMENSIONS ski_season
          METRICS ticket_revenue
        )
        WHERE ski_season < (
          SELECT ski_season FROM MARTS.DIM_DATE WHERE full_date = CURRENT_DATE()
        )
      )
      SELECT ski_season, ticket_revenue, tickets_sold
      FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_REVENUE
        DIMENSIONS ski_season
        METRICS ticket_revenue, tickets_sold
      )
      WHERE ski_season = (SELECT season FROM last_season)
    verified_by: "Cortex Analyst"
    verified_at: 1745500000
    use_as_onboarding_question: true

  - name: fnb_revenue_last_season
    question: "How did food and beverage revenue perform last season?"
    sql: >-
      WITH last_season AS (
        SELECT MAX(ski_season) AS season
        FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_REVENUE
          DIMENSIONS ski_season
          METRICS fnb_revenue
        )
        WHERE ski_season < (
          SELECT ski_season FROM MARTS.DIM_DATE WHERE full_date = CURRENT_DATE()
        )
      )
      SELECT ski_season, fnb_revenue
      FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_REVENUE
        DIMENSIONS ski_season
        METRICS fnb_revenue
      )
      WHERE ski_season = (SELECT season FROM last_season)
    verified_by: "Cortex Analyst"
