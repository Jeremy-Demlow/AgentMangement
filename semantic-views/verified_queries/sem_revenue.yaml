semantic_view: SEM_REVENUE
verified_queries:
  - name: ticket_revenue_by_category
    question: "What is the total ticket sales revenue by ticket category?"
    sql: >-
      SELECT * FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_REVENUE
        METRICS ticket_revenue
        DIMENSIONS ticket_category
      )
      ORDER BY ticket_revenue DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1745200000
    use_as_onboarding_question: true

  - name: rental_revenue_by_product
    question: "What is the total equipment rental revenue by product category?"
    sql: >-
      WITH __fact_rentals AS (
        SELECT product_key, rental_amount
        FROM MARTS.FACT_RENTALS
      ),
      __dim_product AS (
        SELECT product_category, product_key
        FROM MARTS.DIM_PRODUCT
      )
      SELECT dp.product_category,
      SUM(fr.rental_amount) AS total_rental_revenue
      FROM __fact_rentals AS fr
      LEFT OUTER JOIN __dim_product AS dp ON fr.product_key = dp.product_key
      GROUP BY dp.product_category
      ORDER BY total_rental_revenue DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1745200000
    use_as_onboarding_question: true

  - name: fnb_revenue_by_location
    question: "What is the total food and beverage revenue by location name?"
    sql: >-
      SELECT * FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_REVENUE
        METRICS fnb_revenue
        DIMENSIONS location_name
      )
      ORDER BY fnb_revenue DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1745200000
    use_as_onboarding_question: false

  - name: rental_revenue_by_season
    question: "What is the rental revenue and rental markup dollars by ski season?"
    sql: >-
      SELECT * FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_REVENUE
        METRICS rental_revenue, rental_markup_dollars
