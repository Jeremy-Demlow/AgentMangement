  - name: grooming_effectiveness_by_type
    question: "Which trails have the best grooming condition improvement rate, and what grooming types are most effective?"
    sql: >-
      WITH __fact_grooming AS (
        SELECT condition_improved, grooming_key, grooming_type, trail_name
        FROM MARTS.FACT_GROOMING
      )
      SELECT g.trail_name, g.grooming_type,
      COUNT(g.grooming_key) AS total_runs,
      COUNT(CASE WHEN g.condition_improved THEN 1 END) AS improved_runs,
      COUNT(CASE WHEN g.condition_improved THEN 1 END) * 100.0 / NULLIF(NULLIF(COUNT(g.grooming_key), 0), 0) AS improvement_rate_pct
      FROM __fact_grooming AS g
      GROUP BY g.trail_name, g.grooming_type
      ORDER BY improvement_rate_pct DESC NULLS LAST, total_runs DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false
