semantic_view: SEM_STAFFING_ANALYTICS
verified_queries:
  - name: hours_by_department
    question: "What is the total actual hours and total scheduled hours by department?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_STAFFING_ANALYTICS
          METRICS total_actual_hours, total_scheduled_hours
          DIMENSIONS department
      )
    verified_by: "Cortex Analyst"
    verified_at: 1745200000
    use_as_onboarding_question: true

  - name: worst_coverage_dept_day
    question: "Which department and day of week combinations have the worst average staffing coverage, and how do they rank?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
        SEMANTIC.SEM_STAFFING_ANALYTICS
        METRICS avg_coverage
        DIMENSIONS department, day_name
      )
      ORDER BY avg_coverage ASC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: holiday_staffing_gap
    question: "How does average staffing coverage on holidays compare to non-holidays for each department, and what is the coverage gap?"
    sql: >-
      WITH holiday_coverage AS (
        SELECT *
        FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_STAFFING_ANALYTICS
          METRICS avg_coverage
          DIMENSIONS department, is_holiday
        )
      ),
      holiday AS (
        SELECT department, avg_coverage AS holiday_avg_coverage
        FROM holiday_coverage
        WHERE is_holiday = TRUE
      ),
      non_holiday AS (
        SELECT department, avg_coverage AS non_holiday_avg_coverage
        FROM holiday_coverage
        WHERE is_holiday = FALSE
      )
      SELECT COALESCE(h.department, nh.department) AS department,
      h.holiday_avg_coverage, nh.non_holiday_avg_coverage,
      h.holiday_avg_coverage - nh.non_holiday_avg_coverage AS coverage_gap
      FROM holiday AS h
      FULL OUTER JOIN non_holiday AS nh ON h.department = nh.department
      ORDER BY coverage_gap NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: understaffing_by_job_role
    question: "What is the understaffed shift count and overstaffed shift count by job role?"
    sql: >-
      WITH __staffing AS (
        SELECT job_role, staffing_key, coverage_ratio, is_understaffed
        FROM MARTS.FACT_STAFFING
      )
      SELECT s.job_role,
      COUNT(CASE WHEN s.is_understaffed THEN 1 END) AS understaffed_shift_count,
      COUNT(CASE WHEN NOT s.is_understaffed AND s.coverage_ratio > 1 THEN 1 END) AS overstaffed_shift_count
      FROM __staffing AS s
      GROUP BY s.job_role
      ORDER BY understaffed_shift_count DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1745200000
    use_as_onboarding_question: false

  - name: understaffing_trend_by_location
    question: "What is the month-over-month trend of understaffed shift count by location?"
    sql: >-
      WITH __staffing AS (
        SELECT date_key, location_key, is_understaffed
        FROM MARTS.FACT_STAFFING
      ),
      __dates AS (
        SELECT date_key, full_date
        FROM MARTS.DIM_DATE
      ),
      __locations AS (
        SELECT location_key, location_name
        FROM MARTS.DIM_LOCATION
      ),
      monthly_understaffed AS (
        SELECT l.location_name,
        DATE_TRUNC('MONTH', d.full_date) AS month,
        COUNT(CASE WHEN s.is_understaffed THEN 1 END) AS understaffed_count
        FROM __staffing AS s
        LEFT OUTER JOIN __dates AS d ON s.date_key = d.date_key
        LEFT OUTER JOIN __locations AS l ON s.location_key = l.location_key
        GROUP BY l.location_name, DATE_TRUNC('MONTH', d.full_date)
      ),
      mom AS (
        SELECT curr.location_name, curr.month AS curr_month, prev.month AS prev_month,
        curr.understaffed_count AS curr_understaffed_count,
        prev.understaffed_count AS prev_understaffed_count,
        curr.understaffed_count - prev.understaffed_count AS mom_chg,
        (curr.understaffed_count - prev.understaffed_count) / NULLIF(NULLIF(prev.understaffed_count, 0), 0) AS mom_pct_chg
        FROM monthly_understaffed AS curr
        LEFT JOIN monthly_understaffed AS prev
          ON curr.location_name = prev.location_name
          AND curr.month = prev.month + INTERVAL '1 MONTH'
      )
      SELECT * FROM mom
      ORDER BY curr_month DESC NULLS LAST, location_name
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false
