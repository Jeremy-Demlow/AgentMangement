semantic_view: SEM_SAFETY_INCIDENTS
verified_queries:
  - name: incidents_severity_by_type
    question: "What are the total incidents and average severity by incident type?"
    sql: >-
      SELECT * FROM SEMANTIC_VIEW(
        AM_SKI_RESORT.SEMANTIC.SEM_SAFETY_INCIDENTS
        DIMENSIONS incident_type
        METRICS total_incidents, average_severity
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: critical_by_trail
    question: "What is the total incidents and critical incidents count by trail name for trails with at least one critical incident?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          AM_SKI_RESORT.SEMANTIC.SEM_SAFETY_INCIDENTS
          METRICS total_incidents, critical_incidents
          DIMENSIONS trail_name
          WHERE trail_name IS NOT NULL
      )
      WHERE critical_incidents >= 1
      ORDER BY critical_incidents DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: monthly_incidents_response
    question: "What is the monthly total incidents and average patrol response time by month?"
    sql: >-
      WITH __fact_incidents AS (
        SELECT
          incident_date,
          incident_id,
          patrol_response_minutes
        FROM AM_SKI_RESORT.MARTS.FACT_INCIDENTS
      )
      SELECT
        DATE_TRUNC('MONTH', incident_date) AS month,
        COUNT(incident_id) AS total_incidents,
        AVG(patrol_response_minutes) AS avg_patrol_response
      FROM __fact_incidents
      GROUP BY
        DATE_TRUNC('MONTH', incident_date)
      ORDER BY
        month DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: severity_by_skill_level
    question: "What is the average severity and total incidents by customer skill level and severity level?"
    sql: >-
      SELECT * FROM SEMANTIC_VIEW(
        AM_SKI_RESORT.SEMANTIC.SEM_SAFETY_INCIDENTS
        METRICS average_severity, total_incidents
        DIMENSIONS customer_skill_level, severity
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: transport_incidents_by_segment
    question: "What is the total incidents and critical incidents count by customer segment where transport was required?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          AM_SKI_RESORT.SEMANTIC.SEM_SAFETY_INCIDENTS
          DIMENSIONS fact_incidents.customer_segment
          METRICS total_incidents, critical_incidents
          WHERE fact_incidents.transport_required = TRUE
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false
