semantic_view: SEM_PASSHOLDER_ANALYTICS
verified_queries:
  - name: visits_holders_by_pass_type
    question: "What are the pass holder visits and active pass holders by pass type?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
        AM_SKI_RESORT.SEMANTIC.SEM_PASSHOLDER_ANALYTICS
        METRICS pass_holder_visits, active_pass_holders
        DIMENSIONS dim_customer.pass_type
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: revenue_price_by_season
    question: "What is the pass revenue total and average pass price by ski season?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          AM_SKI_RESORT.SEMANTIC.SEM_PASSHOLDER_ANALYTICS
          DIMENSIONS dim_date.ski_season
          METRICS pass_revenue_total, average_pass_price
      )
      ORDER BY ski_season DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: usage_session_by_segment
    question: "What is the pass usage per holder and average pass session hours by customer segment?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          AM_SKI_RESORT.SEMANTIC.SEM_PASSHOLDER_ANALYTICS
          METRICS pass_usage_per_holder, average_pass_session_hours
          DIMENSIONS dim_customer.customer_segment
          WHERE dim_customer.is_pass_holder = TRUE
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: advance_share_revenue_by_category
    question: "What is the advance pass share percentage and pass revenue total by ticket category?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
        AM_SKI_RESORT.SEMANTIC.SEM_PASSHOLDER_ANALYTICS
        DIMENSIONS ticket_category
        METRICS advance_pass_share_pct, pass_revenue_total
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: active_holders_rides_by_state
    question: "What are the active pass holders and pass lift rides total by state?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
        AM_SKI_RESORT.SEMANTIC.SEM_PASSHOLDER_ANALYTICS
        METRICS active_pass_holders, pass_lift_rides_total
        DIMENSIONS dim_customer.state
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false
