semantic_view: SEM_LESSONS_ANALYTICS
verified_queries:
  - name: lessons_by_type_sport
    question: "What is the total lessons count and total revenue by lesson type and sport type?"
    sql: >-
      WITH __fact_lessons AS (
        SELECT
          lesson_type,
          sport_type,
          lesson_id,
          total_lesson_revenue
        FROM MARTS.FACT_LESSONS
      )
      SELECT
        lesson_type,
        sport_type,
        COUNT(lesson_id) AS total_lessons,
        SUM(total_lesson_revenue) AS total_revenue
      FROM __fact_lessons
      GROUP BY
        lesson_type,
        sport_type
      ORDER BY
        lesson_type,
        sport_type
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: rating_by_instructor
    question: "What is the average student rating by instructor name, ordered by highest rating?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_LESSONS_ANALYTICS
          METRICS avg_student_rating
          DIMENSIONS instructor_name
      )
      ORDER BY avg_student_rating DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: true

  - name: monthly_revenue_trend
    question: "What is the monthly total revenue for lessons by month?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_LESSONS_ANALYTICS
          DIMENSIONS DATE_TRUNC('month', fact_lessons.lesson_date) AS lesson_month
          METRICS total_revenue
      )
      ORDER BY lesson_month DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: lessons_by_channel_segment
    question: "What is the total lessons and total revenue by booking channel and customer segment?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_LESSONS_ANALYTICS
          DIMENSIONS booking_channel, customer_segment
          METRICS total_lessons, total_revenue
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: private_group_by_skill
    question: "What are the private lessons count and group lessons count by skill level?"
    sql: >-
      SELECT *
      FROM SEMANTIC_VIEW(
          SEMANTIC.SEM_LESSONS_ANALYTICS
          DIMENSIONS skill_level
          METRICS private_lessons, group_lessons
      )
    verified_by: "Cortex Analyst"
    verified_at: 1744900000
    use_as_onboarding_question: false

  - name: ski_school_last_season_summary
    question: "How did ski school perform last season in terms of lessons and revenue?"
    sql: >-
      WITH __fact_lessons AS (
        SELECT lesson_id, lesson_date, total_lesson_revenue, student_rating
        FROM MARTS.FACT_LESSONS
        WHERE lesson_date BETWEEN
          (SELECT DATEADD(year, -1, DATE_TRUNC('year', CURRENT_DATE()) - INTERVAL '2 months'))
          AND (SELECT DATE_TRUNC('year', CURRENT_DATE()) - INTERVAL '2 months' - INTERVAL '1 day')
      )
      SELECT
        COUNT(lesson_id) AS total_lessons,
        SUM(total_lesson_revenue) AS total_revenue,
        AVG(student_rating) AS avg_student_rating
      FROM __fact_lessons
    verified_by: "Cortex Analyst"
    verified_at: 1745500000
    use_as_onboarding_question: true

  - name: ski_school_by_month
    question: "What is the monthly ski school lesson count and revenue for the most recent complete season?"
    sql: >-
      WITH recent_season AS (
        SELECT MIN(lesson_date) AS start_date, MAX(lesson_date) AS end_date
        FROM MARTS.FACT_LESSONS
        WHERE lesson_date < DATE_TRUNC('year', CURRENT_DATE()) - INTERVAL '2 months'
          AND lesson_date >= DATEADD(year, -1, DATE_TRUNC('year', CURRENT_DATE()) - INTERVAL '2 months')
      ),
      __fact_lessons AS (
        SELECT lesson_id, lesson_date, total_lesson_revenue
        FROM MARTS.FACT_LESSONS
        WHERE lesson_date BETWEEN (SELECT start_date FROM recent_season) AND (SELECT end_date FROM recent_season)
      )
      SELECT
        DATE_TRUNC('month', lesson_date) AS month,
        COUNT(lesson_id) AS total_lessons,
        SUM(total_lesson_revenue) AS total_revenue
      FROM __fact_lessons
      GROUP BY DATE_TRUNC('month', lesson_date)
      ORDER BY month DESC NULLS LAST
    verified_by: "Cortex Analyst"
    verified_at: 1745500000
    use_as_onboarding_question: false
