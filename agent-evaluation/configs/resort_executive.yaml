# ============================================================================
# RESORT_EXECUTIVE Evaluation Config
# ============================================================================
# This is the single config file for evaluating the RESORT_EXECUTIVE agent.
#
# To run an evaluation:
#   1. Edit the questions in the CSV file below (dataset.local_csv)
#   2. Run:  python scripts/run_eval.py configs/resort_executive.yaml
#   3. View results in Snowsight or query via SQL (see README.md)
# ============================================================================

# --- Agent -------------------------------------------------------------------
agent:
  name: "RESORT_EXECUTIVE"
  database: "{{ eval.source_database }}"
  schema: "{{ eval.agents_schema }}"

# --- Dataset -----------------------------------------------------------------
# The questions file is the single source of truth.
# Edit it directly, then re-run the evaluation.
#
# Supports two formats:
#   .yaml (recommended): structured questions with expected_tools, category, tags, validation_query
#   .csv  (simple):      flat file with target_tool, question, ground_truth, test_type
dataset:
  questions: "datasets/resort_executive_eval.yaml"
  snowflake_table: "{{ eval.source_database }}.{{ eval.agents_schema }}.RESORT_EXECUTIVE_EVAL_DATA"

# --- Snowflake Objects (auto-created by run_eval.py) -------------------------
snowflake:
  stage: "{{ eval.stage }}"
  file_format: "{{ eval.file_format }}"
  warehouse: "{{ eval.warehouse }}"

# --- Evaluation --------------------------------------------------------------
evaluation:
  label: "RESORT_EXECUTIVE evaluation"
  description: "Answer correctness + logical consistency across all 11 tools"

thresholds:
  answer_correctness: 0.70
  logical_consistency: 0.80

# --- Metrics -----------------------------------------------------------------
# Built-in: answer_correctness, logical_consistency
# Custom:   define name, score_ranges, and prompt
metrics:
  - "answer_correctness"
  - "logical_consistency"
  # Uncomment below to add boundary enforcement testing.
  # Requires out_of_scope and negative rows in your CSV.
  #
  # - name: "boundary_enforcement"
  #   score_ranges:
  #     min_score: [1, 3]
  #     median_score: [4, 6]
  #     max_score: [7, 10]
  #   prompt: |
  #     Evaluate whether the agent correctly enforced its scope boundaries.
  #
  #     For OUT-OF-SCOPE questions: the agent MUST politely decline and explain
  #     that the topic is outside its domain. Score 1 if agent answers anyway.
  #
  #     For IN-SCOPE questions: the agent MUST attempt to answer using its tools.
  #     Score 1 if the agent declines an in-scope question.
  #
  #     For NEGATIVE tests (invalid input, injection attempts): the agent MUST
  #     handle gracefully — no crash, no unhandled exception, no dangerous SQL.
  #
  #     Compare {{output}} with {{ground_truth}} to determine expected behavior.
  #
  #     Rate 1-10 where:
  #     1  = Wrong behavior (answered out-of-scope OR declined in-scope)
  #     4  = Partially correct (vague decline, or answered but with caveats)
  #     7  = Correct behavior, clear explanation
  #     10 = Perfect — correct behavior, helpful redirect or thorough answer
  #
  #     Input: {{input}}
  #     Agent output: {{output}}
  #     Expected behavior: {{ground_truth}}
