  # ===========================================================================
  # REVENUE — Year-over-Year (YoY) Comparison
  # ===========================================================================
  - question: "How does the current season's ticket revenue compare to the same point last season?"
    expected_tools: ["DailySummaryKPIs", "RevenueAnalytics"]
    category: revenue
    tags: [tickets, yoy, dynamic]
    test_type: in_scope
    validation_query: |
      WITH current_season AS (
        SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE()
      ),
      prior_season AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM current_season)
      ),
      current_rev AS (
        SELECT d.SKI_SEASON AS current_season,
               ROUND(SUM(t.PURCHASE_AMOUNT), 0) AS current_revenue,
               COUNT(*) AS current_tickets
        FROM AM_SKI_RESORT_PROD.MARTS.FACT_TICKET_SALES t
        JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON t.PURCHASE_DATE_KEY = d.DATE_KEY
        WHERE d.SKI_SEASON = (SELECT SKI_SEASON FROM current_season) AND d.FULL_DATE <= CURRENT_DATE()
        GROUP BY d.SKI_SEASON
      ),
      prior_rev AS (
        SELECT d.SKI_SEASON AS prior_season,
               ROUND(SUM(t.PURCHASE_AMOUNT), 0) AS prior_revenue,
               COUNT(*) AS prior_tickets
        FROM AM_SKI_RESORT_PROD.MARTS.FACT_TICKET_SALES t
        JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON t.PURCHASE_DATE_KEY = d.DATE_KEY
        WHERE d.SKI_SEASON = (SELECT season FROM prior_season)
          AND d.WEEK_OF_SEASON <= (
            SELECT MAX(WEEK_OF_SEASON) FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
            WHERE FULL_DATE <= CURRENT_DATE()
              AND SKI_SEASON = (SELECT SKI_SEASON FROM current_season)
          )
        GROUP BY d.SKI_SEASON
      )
      SELECT c.current_season, c.current_revenue, c.current_tickets,
             p.prior_season, p.prior_revenue, p.prior_tickets,
             ROUND((c.current_revenue - p.prior_revenue) / NULLIF(p.prior_revenue, 0) * 100, 1) AS yoy_pct
      FROM current_rev c, prior_rev p
    answer_template: >-
      {current_season} ticket revenue is ${current_revenue:,.0f} ({current_tickets:,} tickets)
      compared to ${prior_revenue:,.0f} ({prior_tickets:,} tickets) through the same point
      in {prior_season}, a {yoy_pct}% year-over-year change.

  # ===========================================================================
  # WEATHER (WeatherAnalytics)
  # ===========================================================================
  - question: "How much total snowfall did we receive during the most recent complete season and how many powder days?"
    expected_tools: ["WeatherAnalytics"]
    category: weather
    tags: [snowfall, powder_days, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(SUM(w.SNOWFALL_INCHES), 1) AS total_snowfall,
             SUM(CASE WHEN w.IS_POWDER_DAY THEN 1 ELSE 0 END) AS powder_days,
             ROUND(AVG(w.TEMP_HIGH_F), 1) AS avg_high,
             ROUND(AVG(w.TEMP_LOW_F), 1) AS avg_low
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_WEATHER w
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON w.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      The resort received {total_snowfall:,.1f} inches of total snowfall during the
      {season} season with {powder_days} powder days.
      Average high temperature was {avg_high}F and average low was {avg_low}F.

  # ===========================================================================
  # LIFT OPERATIONS (LiftOperations)
  # ===========================================================================
  - question: "What was the average lift wait time for the most recent complete season and how many total scans were recorded?"
    expected_tools: ["LiftOperations"]
    category: operations
    tags: [wait_time, lift_scans, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             COUNT(*) AS total_scans,
             ROUND(AVG(ls.WAIT_TIME_MINUTES), 1) AS avg_wait
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_LIFT_SCANS ls
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Average lift wait time for the {season} season was {avg_wait} minutes
      with {total_scans:,} total lift scans recorded.

  - question: "Which days of the week had the most lift activity during the most recent complete season?"
    expected_tools: ["LiftOperations"]
    category: operations
    tags: [day_of_week, lift_scans, ranking, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.DAY_NAME AS day1, COUNT(*) AS count1
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_LIFT_SCANS ls
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.DAY_NAME
      ORDER BY count1 DESC
      LIMIT 1
    answer_template: >-
      {day1} was the busiest day with {count1:,} lift scans during the most recent complete season.
    ground_truth: ""

  # ===========================================================================
  # STAFFING (StaffingAnalytics)
  # ===========================================================================
  - question: "What was the average staffing coverage ratio during the most recent complete season and how many understaffed shifts occurred?"
    expected_tools: ["StaffingAnalytics"]
    category: staffing
    tags: [coverage, understaffed, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(AVG(s.COVERAGE_RATIO), 2) AS avg_coverage,
             SUM(CASE WHEN s.IS_UNDERSTAFFED THEN 1 ELSE 0 END) AS understaffed_shifts
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_STAFFING s
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON s.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
