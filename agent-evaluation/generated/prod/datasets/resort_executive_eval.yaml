      Average staffing coverage ratio was {avg_coverage} during the {season} season
      with {understaffed_shifts} understaffed shifts.

  # ===========================================================================
  # MARKETING (MarketingAnalytics)
  # ===========================================================================
  - question: "Which marketing campaign had the highest conversion rate during the most recent complete season?"
    expected_tools: ["MarketingAnalytics"]
    category: marketing
    tags: [conversion, campaign, ranking, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT m.CAMPAIGN_NAME AS top_campaign,
             m.CAMPAIGN_CHANNEL AS channel,
             ROUND(m.CONVERSION_RATE * 100, 1) AS conversion_pct
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_MARKETING m
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON m.SEND_DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      ORDER BY m.CONVERSION_RATE DESC
      LIMIT 1
    answer_template: >-
      {top_campaign} via {channel} had the highest conversion rate
      at approximately {conversion_pct}% during the most recent complete season.

  # ===========================================================================
  # CUSTOMER SATISFACTION (CustomerSatisfaction)
  # ===========================================================================
  - question: "What was our average NPS score and customer rating during the most recent complete season?"
    expected_tools: ["CustomerSatisfaction"]
    category: satisfaction
    tags: [nps, rating, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(AVG(f.NPS_SCORE), 1) AS avg_nps,
             ROUND(AVG(f.RATING), 2) AS avg_rating,
             COUNT(*) AS feedback_count
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_FEEDBACK f
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON f.FEEDBACK_DATE = d.FULL_DATE
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Average NPS score was {avg_nps} and average customer rating was {avg_rating}
      out of 5 during the {season} season, based on {feedback_count:,} feedback submissions.

  # ===========================================================================
  # SAFETY (SafetyIncidents)
  # ===========================================================================
  - question: "How many safety incidents occurred during the most recent complete season and what was the average patrol response time?"
    expected_tools: ["SafetyIncidents"]
    category: safety
    tags: [incidents, response_time, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             COUNT(*) AS incident_count,
             ROUND(AVG(i.SEVERITY_SCORE), 2) AS avg_severity,
             ROUND(AVG(i.PATROL_RESPONSE_MINUTES), 1) AS avg_response_time
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_INCIDENTS i
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON i.INCIDENT_DATE = d.FULL_DATE
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      There were {incident_count} safety incidents during the {season} season
      with an average severity score of {avg_severity} and
      average patrol response time of {avg_response_time} minutes.

  # ===========================================================================
  # SKI SCHOOL (SkiSchoolAnalytics)
  # ===========================================================================
  - question: "How did ski school perform during the most recent complete season in terms of lessons and revenue?"
    expected_tools: ["SkiSchoolAnalytics"]
    category: ski_school
    tags: [lessons, revenue, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             COUNT(*) AS lesson_count,
             ROUND(SUM(l.TOTAL_LESSON_REVENUE), 0) AS total_revenue,
             ROUND(AVG(l.STUDENT_RATING), 2) AS avg_rating
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_LESSONS l
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON l.LESSON_DATE = d.FULL_DATE
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
