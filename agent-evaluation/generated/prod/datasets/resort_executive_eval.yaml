    answer_template: >-
      Ski school delivered {lesson_count:,} lessons during the {season} season
      generating approximately ${total_revenue:,.0f} in total lesson revenue.
      Average student rating was {avg_rating} out of 5.

  # ===========================================================================
  # PASSHOLDER (PassholderAnalytics)
  # ===========================================================================
  - question: "How many season passes were sold for the most recent complete season and what was the total pass revenue?"
    expected_tools: ["PassholderAnalytics"]
    category: passholders
    tags: [passes, revenue, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT (SELECT season FROM most_recent_complete) AS season,
             COUNT(*) AS passes_sold,
             ROUND(SUM(sp.PURCHASE_AMOUNT), 0) AS total_revenue,
             ROUND(AVG(sp.PURCHASE_AMOUNT), 2) AS avg_price,
             SUM(CASE WHEN sp.IS_RENEWAL THEN 1 ELSE 0 END) AS renewals
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_SEASON_PASS_SALES sp
      WHERE sp.VALID_SEASON = (SELECT season FROM most_recent_complete)
    answer_template: >-
      {passes_sold:,} season passes were sold for the {season} season
      generating approximately ${total_revenue:,.0f} in revenue,
      with an average pass price of ${avg_price:,.2f}. {renewals:,} were renewals.

  # ===========================================================================
  # CUSTOMER SEGMENTS (CustomerAnalytics) — Static (dimension data, not time-dependent)
  # ===========================================================================
  - question: "What are the largest customer segments at the resort by number of customers?"
    expected_tools: ["CustomerAnalytics"]
    category: customers
    tags: [segments, ranking]
    test_type: in_scope
    validation_query: |
      SELECT LISTAGG(seg || ' (' || cnt || ')', ', ') WITHIN GROUP (ORDER BY cnt DESC) AS segment_summary
      FROM (
        SELECT CUSTOMER_SEGMENT AS seg, COUNT(*) AS cnt
        FROM AM_SKI_RESORT_PROD.MARTS.DIM_CUSTOMER
        GROUP BY CUSTOMER_SEGMENT
        ORDER BY cnt DESC
      )
    answer_template: >-
      The largest customer segments are {segment_summary}.

  # ===========================================================================
  # CROSS-DOMAIN — Current Season to Date (tests agent's ability to handle partial season)
  # ===========================================================================
  - question: "Give me a summary of the current season to date: total ticket revenue, total snowfall, and number of safety incidents."
    expected_tools: ["DailySummaryKPIs", "RevenueAnalytics", "WeatherAnalytics", "SafetyIncidents"]
    category: cross_domain
    tags: [season_to_date, multi_tool, dynamic]
    test_type: in_scope
    validation_query: |
      WITH current_season AS (
        SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE()
      ),
      tickets AS (
        SELECT ROUND(SUM(t.PURCHASE_AMOUNT), 0) AS ticket_rev
        FROM AM_SKI_RESORT_PROD.MARTS.FACT_TICKET_SALES t
        JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON t.PURCHASE_DATE_KEY = d.DATE_KEY
        WHERE d.SKI_SEASON = (SELECT SKI_SEASON FROM current_season) AND d.FULL_DATE <= CURRENT_DATE()
      ),
      weather AS (
        SELECT ROUND(SUM(w.SNOWFALL_INCHES), 1) AS snowfall
        FROM AM_SKI_RESORT_PROD.MARTS.FACT_WEATHER w
        JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON w.DATE_KEY = d.DATE_KEY
        WHERE d.SKI_SEASON = (SELECT SKI_SEASON FROM current_season) AND d.FULL_DATE <= CURRENT_DATE()
      ),
      safety AS (
        SELECT COUNT(*) AS incidents
        FROM AM_SKI_RESORT_PROD.MARTS.FACT_INCIDENTS i
        JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON i.INCIDENT_DATE = d.FULL_DATE
        WHERE d.SKI_SEASON = (SELECT SKI_SEASON FROM current_season) AND d.FULL_DATE <= CURRENT_DATE()
      )
      SELECT (SELECT SKI_SEASON FROM current_season) AS season,
             t.ticket_rev, w.snowfall, s.incidents
      FROM tickets t, weather w, safety s
    answer_template: >-
      Current {season} season to date: ticket revenue is ${ticket_rev:,.0f},
      total snowfall is {snowfall:,.1f} inches, and there have been {incidents} safety incidents.

