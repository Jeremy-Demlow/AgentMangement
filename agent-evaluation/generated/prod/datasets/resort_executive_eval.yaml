# RESORT_EXECUTIVE - Agent Evaluation Questions (Dynamic Ground Truth)
#
# Test questions for AM_SKI_RESORT_PROD.AGENTS.RESORT_EXECUTIVE
# Tools: DailySummaryKPIs, RevenueAnalytics, WeatherAnalytics, LiftOperations,
#        StaffingAnalytics, MarketingAnalytics, CustomerSatisfaction,
#        SafetyIncidents, SkiSchoolAnalytics, PassholderAnalytics, CustomerAnalytics
#
# Ground Truth Strategy:
#   - validation_query: SQL executed at eval time to generate fresh ground truth
#   - answer_template: Python format string that combines query results into NL ground truth
#   - ground_truth: Static fallback (used only when no validation_query)
#
# Time Anchoring:
#   Questions use relative references ("most recent complete season", "current season")
#   so the same eval set works across seasons without manual updates.
#   See references/dynamic-ground-truth.md for patterns.

questions:
  # ===========================================================================
  # REVENUE — Season Totals (RevenueAnalytics / DailySummaryKPIs)
  # ===========================================================================
  - question: "What was our total ticket revenue for the most recent complete season?"
    expected_tools: ["DailySummaryKPIs", "RevenueAnalytics"]
    category: revenue
    tags: [tickets, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH current_season AS (
        SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE()
      ),
      most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM current_season)
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(SUM(t.PURCHASE_AMOUNT), 2) AS total_revenue,
             COUNT(*) AS ticket_count,
             ROUND(AVG(t.PURCHASE_AMOUNT), 2) AS avg_price
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_TICKET_SALES t
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON t.PURCHASE_DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Total ticket revenue for the {season} season was approximately
      ${total_revenue:,.0f} from {ticket_count:,} tickets sold,
      with an average ticket price of ${avg_price:,.2f}.

  - question: "How did food and beverage revenue perform during the most recent complete season?"
    expected_tools: ["RevenueAnalytics"]
    category: revenue
    tags: [fnb, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_PROD.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(SUM(fb.TOTAL_AMOUNT), 0) AS total_revenue,
             COUNT(*) AS transaction_count
      FROM AM_SKI_RESORT_PROD.MARTS.FACT_FOOD_BEVERAGE fb
      JOIN AM_SKI_RESORT_PROD.MARTS.DIM_DATE d ON fb.TRANSACTION_DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Food and beverage revenue for the {season} season was approximately
      ${total_revenue:,.0f} from {transaction_count:,} transactions.

