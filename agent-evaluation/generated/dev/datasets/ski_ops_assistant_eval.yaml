# SKI_OPS_ASSISTANT - Agent Evaluation Questions (Dynamic Ground Truth)
#
# Test questions for AM_SKI_RESORT_DEV.AGENTS.SKI_OPS_ASSISTANT
# Tools: LiftOperationsAnalytics, StaffingAnalytics, WeatherAnalytics, SafetyIncidentsAnalytics
#
# Ground Truth Strategy:
#   - validation_query: SQL executed at eval time to generate fresh ground truth
#   - answer_template: Python format string that combines query results into NL ground truth
#
# Time Anchoring:
#   Questions use natural-language time references ("last season", "this season")
#   that mirror how real users talk.  "Last season" = the season before the
#   current one; "this season" / "current season" = the season in progress.

questions:
  # ===========================================================================
  # LIFT OPERATIONS — Wait Times and Capacity
  # ===========================================================================
  - question: "What was the average lift wait time last season?"
    expected_tools: ["LiftOperationsAnalytics"]
    category: operations
    tags: [wait_time, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(AVG(ls.WAIT_TIME_MINUTES), 1) AS avg_wait,
             COUNT(*) AS total_scans
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_LIFT_SCANS ls
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Average lift wait time for the {season} season was {avg_wait} minutes
      across {total_scans:,} total lift scans.

  - question: "Which lifts had the longest average wait times last season?"
    expected_tools: ["LiftOperationsAnalytics"]
    category: operations
    tags: [wait_time, ranking, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT l.LIFT_NAME AS lift_name,
             ROUND(AVG(ls.WAIT_TIME_MINUTES), 1) AS avg_wait,
             COUNT(*) AS scan_count
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_LIFT_SCANS ls
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_LIFT l ON ls.LIFT_KEY = l.LIFT_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY l.LIFT_NAME
      ORDER BY avg_wait DESC
      LIMIT 3
    answer_template: >-
      {lift_name} averaged {avg_wait} minutes wait time ({scan_count:,} scans).

  - question: "How do weekend wait times compare to weekday wait times across all lifts?"
    expected_tools: ["LiftOperationsAnalytics"]
    category: operations
    tags: [wait_time, weekend_vs_weekday, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT ROUND(AVG(CASE WHEN d.IS_WEEKEND THEN ls.WAIT_TIME_MINUTES END), 1) AS weekend_avg,
             ROUND(AVG(CASE WHEN NOT d.IS_WEEKEND THEN ls.WAIT_TIME_MINUTES END), 1) AS weekday_avg,
             d.SKI_SEASON AS season
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_LIFT_SCANS ls
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      During the {season} season, average weekend wait time was {weekend_avg} minutes
      compared to {weekday_avg} minutes on weekdays.

  # ===========================================================================
  # STAFFING — Coverage and Understaffing
  # ===========================================================================
  - question: "What was the average staffing coverage ratio last season?"
    expected_tools: ["StaffingAnalytics"]
    category: staffing
    tags: [coverage, season_total, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(AVG(s.COVERAGE_RATIO), 2) AS avg_coverage,
             SUM(CASE WHEN s.IS_UNDERSTAFFED THEN 1 ELSE 0 END) AS understaffed_shifts,
             COUNT(*) AS total_shifts
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_STAFFING s
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON s.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Average staffing coverage ratio was {avg_coverage} during the {season} season
      with {understaffed_shifts} understaffed shifts out of {total_shifts:,} total shifts.

  - question: "Which departments had the most understaffed shifts last season?"
    expected_tools: ["StaffingAnalytics"]
    category: staffing
    tags: [understaffed, department, ranking, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT s.DEPARTMENT AS dept,
             SUM(CASE WHEN s.IS_UNDERSTAFFED THEN 1 ELSE 0 END) AS understaffed_count,
             COUNT(*) AS total_shifts
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_STAFFING s
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON s.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY s.DEPARTMENT
      ORDER BY understaffed_count DESC
      LIMIT 3
    answer_template: >-
      {dept} had {understaffed_count} understaffed shifts out of {total_shifts:,} total.

  # ===========================================================================
  # WEATHER — Snowfall and Conditions
  # ===========================================================================
  - question: "How much total snowfall did we get last season and how many powder days?"
    expected_tools: ["WeatherAnalytics"]
    category: weather
    tags: [snowfall, powder_days, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(SUM(w.SNOWFALL_INCHES), 1) AS total_snowfall,
             SUM(CASE WHEN w.IS_POWDER_DAY THEN 1 ELSE 0 END) AS powder_zone_days,
             COUNT(DISTINCT CASE WHEN w.IS_POWDER_DAY THEN d.FULL_DATE END) AS powder_calendar_days
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_WEATHER w
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON w.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      Total snowfall for the {season} season was {total_snowfall:,.1f} inches across all mountain zones
      with {powder_zone_days} powder day observations ({powder_calendar_days} unique calendar powder days).

  - question: "What were the wind conditions like last season? How many high wind days?"
    expected_tools: ["WeatherAnalytics"]
    category: weather
    tags: [wind, high_wind, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             ROUND(AVG(w.WIND_SPEED_MPH), 1) AS avg_wind,
             ROUND(MAX(w.WIND_SPEED_MPH), 1) AS max_wind,
             SUM(CASE WHEN w.IS_HIGH_WIND THEN 1 ELSE 0 END) AS high_wind_zone_days,
             COUNT(DISTINCT CASE WHEN w.IS_HIGH_WIND THEN d.FULL_DATE END) AS high_wind_calendar_days
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_WEATHER w
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON w.DATE_KEY = d.DATE_KEY
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      During the {season} season, average wind speed was {avg_wind} mph
      with a peak gust of {max_wind} mph. There were {high_wind_zone_days} high wind
      observations across zones ({high_wind_calendar_days} unique high wind days).

  # ===========================================================================
  # SAFETY — Incidents and Response
  # ===========================================================================
  - question: "How many safety incidents occurred last season and what was the average patrol response time?"
    expected_tools: ["SafetyIncidentsAnalytics"]
    category: safety
    tags: [incidents, response_time, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT d.SKI_SEASON AS season,
             COUNT(*) AS incident_count,
             ROUND(AVG(i.SEVERITY_SCORE), 2) AS avg_severity,
             ROUND(AVG(i.PATROL_RESPONSE_MINUTES), 1) AS avg_response
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_INCIDENTS i
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON i.INCIDENT_DATE = d.FULL_DATE
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY d.SKI_SEASON
    answer_template: >-
      There were {incident_count} safety incidents during the {season} season
      with average patrol response time of {avg_response} minutes.

  - question: "What were the most common incident types last season?"
    expected_tools: ["SafetyIncidentsAnalytics"]
    category: safety
    tags: [incident_type, ranking, dynamic]
    test_type: in_scope
    validation_query: |
      WITH most_recent_complete AS (
        SELECT MAX(SKI_SEASON) AS season FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE
        WHERE SKI_SEASON < (SELECT SKI_SEASON FROM AM_SKI_RESORT_DEV.MARTS.DIM_DATE WHERE FULL_DATE = CURRENT_DATE())
      )
      SELECT i.INCIDENT_TYPE AS incident_type,
             COUNT(*) AS count
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_INCIDENTS i
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON i.INCIDENT_DATE = d.FULL_DATE
      WHERE d.SKI_SEASON = (SELECT season FROM most_recent_complete)
      GROUP BY i.INCIDENT_TYPE
      ORDER BY count DESC
      LIMIT 3
    answer_template: >-
      {incident_type} had {count} incidents.

  # ===========================================================================
  # CROSS-DOMAIN — Operational Summary
  # ===========================================================================
  - question: "Give me a daily operations summary for the most recent day with data: lift wait times, staffing coverage, weather, and any safety incidents."
    expected_tools: ["LiftOperationsAnalytics", "StaffingAnalytics", "WeatherAnalytics", "SafetyIncidentsAnalytics"]
    category: cross_domain
    tags: [daily_summary, multi_tool, dynamic]
    test_type: in_scope
    validation_query: |
      WITH latest_day AS (
        SELECT MAX(d.FULL_DATE) AS dt
        FROM AM_SKI_RESORT_DEV.MARTS.FACT_LIFT_SCANS ls
        JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
      ),
      lifts AS (
        SELECT ROUND(AVG(ls.WAIT_TIME_MINUTES), 1) AS avg_wait,
               COUNT(*) AS total_scans
        FROM AM_SKI_RESORT_DEV.MARTS.FACT_LIFT_SCANS ls
        JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON ls.DATE_KEY = d.DATE_KEY
        WHERE d.FULL_DATE = (SELECT dt FROM latest_day)
      ),
      staff AS (
        SELECT ROUND(AVG(s.COVERAGE_RATIO), 2) AS avg_coverage
        FROM AM_SKI_RESORT_DEV.MARTS.FACT_STAFFING s
        JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON s.DATE_KEY = d.DATE_KEY
        WHERE d.FULL_DATE = (SELECT dt FROM latest_day)
      ),
      wx AS (
        SELECT ROUND(SUM(w.SNOWFALL_INCHES), 1) AS snowfall,
               ROUND(AVG(w.TEMP_HIGH_F), 0) AS high_temp
        FROM AM_SKI_RESORT_DEV.MARTS.FACT_WEATHER w
        JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON w.DATE_KEY = d.DATE_KEY
        WHERE d.FULL_DATE = (SELECT dt FROM latest_day)
      ),
      safety AS (
        SELECT COUNT(*) AS incidents
        FROM AM_SKI_RESORT_DEV.MARTS.FACT_INCIDENTS i
        WHERE i.INCIDENT_DATE = (SELECT dt FROM latest_day)
      )
      SELECT (SELECT dt FROM latest_day) AS report_date,
             l.avg_wait, l.total_scans, s.avg_coverage,
             w.snowfall, w.high_temp, sf.incidents
      FROM lifts l, staff s, wx w, safety sf
    answer_template: >-
      Operations summary for {report_date}: avg wait {avg_wait} min across {total_scans:,} scans,
      staffing coverage {avg_coverage}, snowfall {snowfall} in, high {high_temp}F,
      {incidents} safety incidents.

  # ===========================================================================
  # SUMMER OPERATIONS — Bike Park, Trail Patrol, Seasonal Staffing
  # ===========================================================================
  - question: "What are the most common summer safety incidents?"
    expected_tools: ["SafetyIncidentsAnalytics"]
    category: safety
    tags: [summer, incidents, dynamic]
    test_type: in_scope
    ground_truth_invocations:
      - tool_name: "SafetyIncidentsAnalytics"
        tool_input: "Most common summer safety incident types"
        tool_output: "SQL filtering FACT_INCIDENTS joined to DIM_DATE where season_type = 'summer', grouped by incident_type, ordered by count descending. Expected types: bike_crash, trail_fall, dehydration, wildlife_encounter."
    validation_query: |
      SELECT i.INCIDENT_TYPE, COUNT(*) AS incident_count
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_INCIDENTS i
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON i.DATE_KEY = d.DATE_KEY
      WHERE d.SEASON_TYPE = 'summer'
      GROUP BY i.INCIDENT_TYPE ORDER BY incident_count DESC LIMIT 5
    answer_template: >-
      The most common summer incident types include bike crashes, trail falls,
      dehydration, and wildlife encounters, totaling {incident_count} incidents
      for the top category.

  - question: "How does summer staffing coverage compare to winter?"
    expected_tools: ["StaffingAnalytics"]
    category: staffing
    tags: [summer, comparison, dynamic]
    test_type: in_scope
    ground_truth_invocations:
      - tool_name: "StaffingAnalytics"
        tool_input: "Compare summer staffing coverage to winter"
        tool_output: "SQL grouping FACT_STAFFING by DIM_DATE.SEASON_TYPE, computing AVG(coverage_pct) and COUNT(DISTINCT schedule_date) for both summer and winter."
    validation_query: |
      SELECT d.SEASON_TYPE, ROUND(AVG(s.COVERAGE_PCT), 1) AS avg_coverage, COUNT(DISTINCT s.SCHEDULE_DATE) AS days
      FROM AM_SKI_RESORT_DEV.MARTS.FACT_STAFFING s
      JOIN AM_SKI_RESORT_DEV.MARTS.DIM_DATE d ON s.SCHEDULE_DATE_KEY = d.DATE_KEY
      GROUP BY d.SEASON_TYPE ORDER BY d.SEASON_TYPE
    answer_template: >-
      Summer staffing operates with smaller crews across fewer departments.
      Average coverage is {avg_coverage}% across {days} operating days for the {SEASON_TYPE} season.
